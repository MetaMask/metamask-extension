# Required for CI: repo slug must match GitHub.
# Config path is passed via action input `config-path: .github/ai-pr-analyzer`.
#
# Critical lists are a complementary AI signal only — they do NOT replace CODEOWNERS.
# Prefer per-subdirectory CODEOWNERS for ownership gates (ui/selectors, ui/ducks, etc.).
# package.json is included as a soft signal (any dep/manifest change);
repo: MetaMask/metamask-extension

critical:
  files:
    # Tooling / build entrypoints
    - package.json
    - babel.config.js
    - tsconfig.json
    - builds.yml
    - privacy-snapshot.json
    - development/circular-deps.jsonc
    - .github/CODEOWNERS
    # Extension entry / security-sensitive scripts
    - app/manifest/v2/_base.json
    - app/manifest/v3/_base.json
    - app/scripts/metamask-controller.js
    - app/scripts/background.js
    - app/service-worker.ts
    - app/offscreen/offscreen.ts
    - app/scripts/ui.js
    - app/scripts/contentscript.js
    - app/scripts/inpage.js
    - app/scripts/migrations/index.js
    - app/scripts/messenger-client-init/network-controller-init.ts
    - app/scripts/lib/createMetamaskMiddleware.ts
    - app/scripts/lib/encryptor-factory.ts
    # Narrow UI store wiring only
    - ui/store/store.ts
    - ui/store/background-connection.ts
    - ui/store/patch-store-substream-connection.ts

  keywords:
    - Controller
    - Keyring
    - Permission
    - Middleware
    - Migration

  paths:
    # Security surface
    - app/scripts/controllers/permissions/
    - app/scripts/lib/snap-keyring/
    - app/scripts/lib/state-corruption/
    - app/scripts/lib/ppom/
    - app/scripts/lib/trust-signals/
    # Core wiring
    - app/scripts/messenger-client-init/messengers/
    - app/scripts/streams/
    - app/scripts/lib/rpc-method-middleware/
    - app/scripts/lib/transaction/
    # Build system / supply chain
    - development/build/
    - development/webpack/
    - lavamoat/
    # CI / workflows
    - .github/workflows/
    - .github/scripts/

searchDirs:
  - app/
  - ui/
  - shared/
  - development/
  - test/
  - .github/

models:
  # +1 signal when critical files > 5
  criticalFileThreshold: 5
  # +1 signal when changed files > 10
  fileCountThreshold: 10
  # +1 signal when total diff lines > 300
  largeDiffThreshold: 300
modes:
  - pr-risk-analysis
