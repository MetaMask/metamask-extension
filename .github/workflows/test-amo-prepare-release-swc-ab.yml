name: Test AMO prepare_release SWC A/B

# Temporary experiment workflow (inspired by #46392).
# Proves prepare_release.sh runtime determinism for:
#   - stock tagged v13.47.1 (@swc/core 1.13.3, same as main at that release)
#   - same path with SWC bump inject from bump/swc-core-amo-determinism (1.16.2)
# across main + flask, 100 iterations each (400 jobs total).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches-ignore:
      - stable
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of iterations per variant/source cell
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      iterations: ${{ steps.set.outputs.iterations }}
    steps:
      - name: Build iteration matrix
        id: set
        shell: bash
        run: |
          N="${{ github.event.inputs.iterations || '100' }}"
          python3 - <<PY >> "${GITHUB_OUTPUT}"
          import json
          n = int("${N}")
          print("iterations=" + json.dumps(list(range(1, n + 1))))
          PY

  prepare-release-repro:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [main, flask]
        source: [stock, bump]
        iteration: ${{ fromJSON(needs.setup.outputs.iterations) }}
    env:
      FIREFOX_BUNDLE_SCRIPT_TOKEN: ${{ secrets.FIREFOX_BUNDLE_SCRIPT_TOKEN }}
      AGENT_VERSION: '13.47.1'
      AGENT_LAST_LISTED: '13.46.1'
      AGENT_SWC_BUMP_REF: bump/swc-core-amo-determinism
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run prepare_release (${{ matrix.variant }} / ${{ matrix.source }})
        id: repro
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/test-amo-prepare-release-repro.sh" \
            "${{ matrix.variant }}" \
            "${{ matrix.source }}"

      - name: Upload result JSON
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: result-${{ matrix.source }}-${{ matrix.variant }}-${{ matrix.iteration }}
          path: results/result.json
          retention-days: 3

      - name: Upload mismatched runtime (stock only, when not published hash)
        if: ${{ matrix.source == 'stock' && steps.repro.outputs.runtime_hash != '' && ((matrix.variant == 'main' && steps.repro.outputs.runtime_hash != 'b574af00e40dcd7e628a') || (matrix.variant == 'flask' && steps.repro.outputs.runtime_hash != '0c40264eb2c3354bf635')) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mismatch-${{ matrix.variant }}-${{ matrix.iteration }}-${{ steps.repro.outputs.runtime_hash }}
          path: results/result.json
          retention-days: 3

  summarize:
    needs: prepare-release-repro
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          path: downloaded-results
          merge-multiple: false

      - name: Aggregate runtime hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          rows = []
          for path in Path("downloaded-results").rglob("result.json"):
              rows.append(json.loads(path.read_text(encoding="utf-8")))

          cells = defaultdict(list)
          for row in rows:
              key = (row.get("sourceMode"), row.get("variant"))
              cells[key].append(row)

          summary = {
              "totalResults": len(rows),
              "cells": {},
              "proofNote": (
                  "stock = tagged v13.47.1 prepare_release (@swc/core 1.13.3). "
                  "bump = same path with inject from bump/swc-core-amo-determinism (@swc/core 1.16.2, mangle ON). "
                  "Determinism proof = unique local runtime hashes among successful local builds."
              ),
          }

          for source in ("stock", "bump"):
              for variant in ("main", "flask"):
                  subset = cells.get((source, variant), [])
                  successful = [r for r in subset if r.get("runtimeHash")]
                  hashes = Counter(r.get("runtimeHash") or "none" for r in subset)
                  shas = Counter(r.get("runtimeSha256") or "none" for r in successful)
                  summary["cells"][f"{source}/{variant}"] = {
                      "runs": len(subset),
                      "successfulLocalBuilds": len(successful),
                      "uniqueRuntimeHashes": dict(hashes),
                      "uniqueRuntimeHashCount": len(hashes),
                      "uniqueSha256Count": len([k for k in shas if k != "none"]),
                      "localDeterministicAmongSuccessful": (
                          len(successful) > 0
                          and len({r["runtimeHash"] for r in successful}) == 1
                          and len({r["runtimeSha256"] for r in successful}) == 1
                      ),
                  }

          Path("summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))

          # Fail the summarize job if stock is flaky OR bump is non-deterministic
          # among successful builds. Empty builds (harness flakes) are reported
          # but do not alone fail determinism for bump.
          stock_main = summary["cells"].get("stock/main", {})
          stock_flask = summary["cells"].get("stock/flask", {})
          bump_main = summary["cells"].get("bump/main", {})
          bump_flask = summary["cells"].get("bump/flask", {})

          problems = []
          if stock_main.get("uniqueRuntimeHashCount", 0) <= 1 and stock_flask.get("uniqueRuntimeHashCount", 0) <= 1:
              problems.append(
                  "stock did not show multiple runtime hashes; A/B contrast may be weak"
              )
          if not bump_main.get("localDeterministicAmongSuccessful", False):
              problems.append("bump/main was not deterministic among successful builds")
          if not bump_flask.get("localDeterministicAmongSuccessful", False):
              problems.append("bump/flask was not deterministic among successful builds")

          # Always print guidance; only fail hard on bump nondeterminism.
          hard = [p for p in problems if p.startswith("bump/")]
          if hard:
              raise SystemExit("; ".join(hard))
          print("SUMMARY_OK")
          PY

      - name: Upload summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: amo-prepare-release-swc-ab-summary
          path: summary.json
          retention-days: 14
