name: Main detector heartbeat

# Once a day, checks that every Main run on main that finished a few hours ago
# got a detector run, and posts to Slack only when one did not start or
# failed. A day with no Main runs (weekends, holidays) is not a problem.
# See .github/scripts/main-detector/README.md.

on:
  # TEMPORARY (1/2): lets the first push register the workflow on the trigger ref. Remove with the trigger ref.
  push:
    branches: [trigger-ci-pilot-b]
    paths: ['.github/workflows/main-detector-heartbeat.yml']
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script has no dependencies, so there is no install step.
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check the detector ran for recent Main commits
        env:
          GH_TOKEN: ${{ github.token }}
          # TEMPORARY (2/2): no webhook, so the run only prints what it would post.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ./.github/scripts/main-detector/heartbeat-cli.mts
