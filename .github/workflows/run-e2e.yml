name: Run E2E

on:
  workflow_call:
    inputs:
      test-suite-name:
        required: true
        type: string
        description: The name of the E2E test suite
      build-artifact:
        type: string
        default: ''
        description: The build artifact to download
      build-command:
        type: string
        default: ''
        description: The build command to run
      test-command:
        required: true
        type: string
        description: The test command to run
      playwright-browsers:
        required: false
        type: string
        default: ''
        description: >-
          If set, installs the given space-separated Playwright browsers
          (e.g. `chromium` or `firefox`) via the cached
          `install-playwright-browsers` composite action before tests run.
      builds-from-run:
        required: true
        type: string
        description: The run ID to get builds from
      test-timeout-minutes:
        type: number
        default: 40
        description: The timeout in minutes for the test command
      matrix-index:
        type: number
        default: 0
        description: The index of the job in the matrix
      matrix-total:
        type: number
        default: 1
        description: The total number of jobs in the matrix
      test-artifacts-path:
        type: string
        default: |
          ./test-artifacts
          ./test/test-results/e2e
        description: The path to the test artifacts
      pull-stellar-image:
        type: boolean
        default: false
        description: >-
          When true, start pulling stellar/quickstart as soon as the runner
          boots (before checkout) so Quickstart-backed Selenium specs do not
          wait on docker pull inside Mocha before(). Only the main Chrome and
          Firefox webpack suites run those specs.
    secrets:
      INFURA_PROJECT_ID:
        required: false

jobs:
  run-e2e:
    name: ${{ inputs.test-suite-name }}${{ inputs.matrix-total > 1 && format(' ({0})', inputs.matrix-index) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SELENIUM_HEADLESS: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This is to support tests that set manifestFlags.testing.infuraProjectId, such as power-user.spec.ts
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      ASSETS_UNIFIED_STATE_ENABLED: 'true'
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      # Enable colors in CI for enhanced test reporter output
      FORCE_COLOR: '1'
      # For a `pull_request` event, the branch is `github.head_ref``.
      # For a `push` event, the branch is `github.ref_name`.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # For a `pull_request` event, the head commit hash is `github.event.pull_request.head.sha`.
      # For a `push` event, the head commit hash is `github.sha`.
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      # True when the repository itself is a fork (policy/feature gating).
      IS_FORK: ${{ github.event.repository.fork }}
      # True for PRs whose head branch lives in a different repository (security gating).
      IS_CROSS_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      MATRIX_INDEX: ${{ inputs.matrix-index }}
      MATRIX_TOTAL: ${{ inputs.matrix-total }}
      JOB_NAME: ${{ inputs.test-suite-name }}${{ inputs.matrix-total > 1 && format(' ({0})', inputs.matrix-index) || '' }}
      RUN_ID: ${{ github.run_id }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      TEST_SUITE_NAME: ${{ inputs.test-suite-name }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      # Same default as test/e2e/seeder/stellar/node.ts
      STELLAR_QUICKSTART_IMAGE: stellar/quickstart
    steps:
      # Start before checkout so the pull overlaps yarn install and artifact
      # downloads. docker run in StellarNode.start() is a no-op pull when cached.
      - name: Start stellar/quickstart image pull
        if: ${{ inputs.pull-stellar-image }}
        run: |
          set -euo pipefail
          IMAGE="${STELLAR_QUICKSTART_IMAGE:-stellar/quickstart}"
          echo "Starting docker pull ${IMAGE}"
          # New session so the pull survives the step shell exiting (SIGHUP).
          setsid nohup docker pull "${IMAGE}" \
            > "${RUNNER_TEMP}/stellar-docker-pull.log" 2>&1 < /dev/null &
          echo $! > "${RUNNER_TEMP}/stellar-docker-pull.pid"
          disown || true
          echo "Started docker pull ${IMAGE} (pid $(cat "${RUNNER_TEMP}/stellar-docker-pull.pid"))"

      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Install anvil with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Download build artifact
        if: ${{ inputs.build-artifact != '' }}
        id: download-build-artifact
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.build-artifact }}
          github-token: ${{ secrets.GITHUB_TOKEN }} # This is required when downloading artifacts from a different repository or from a different workflow run.
          run-id: ${{ inputs.builds-from-run }} # Download from the run that produced the builds.

      # if there is a build-command and there is no build artifact, or the specified artifact does not exist, we run the build command
      - run: ${{ inputs.build-command }}
        if: ${{ inputs.build-command != '' && (inputs.build-artifact == '' || steps.download-build-artifact.outcome == 'failure') }}

      - name: Download changed-files artifact
        if: ${{ env.BRANCH != 'main' }}
        id: download-changed-files
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: changed-files
          path: ./changed-files/

      # if the changed-files artifact does not exist, we get the diff
      - run: yarn tsx .github/scripts/git-diff-default-branch.mts
        if: ${{ steps.download-changed-files.outcome == 'failure' }}

      - name: Download test-runs-for-splitting
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: test-runs-for-splitting
          path: test/test-results/

      # On re-run (run_attempt > 1), download previous test results to identify failed tests
      - name: Download previous test results (on re-run)
        if: ${{ github.run_attempt > 1 }}
        id: download-previous-results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.JOB_NAME }}
          path: ./previous-test-results/

      - name: Install Playwright browsers
        if: ${{ inputs.playwright-browsers != '' }}
        uses: ./.github/actions/install-playwright-browsers
        with:
          browsers: ${{ inputs.playwright-browsers }}

      - name: Pin geckodriver 0.36.0 (Firefox only)
        if: ${{ contains(inputs.test-command, 'firefox') }}
        run: .github/scripts/pin-geckodriver.sh

      - name: Wait for stellar/quickstart image
        if: ${{ inputs.pull-stellar-image }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            IMAGE="${STELLAR_QUICKSTART_IMAGE:-stellar/quickstart}"
            PID_FILE="${RUNNER_TEMP}/stellar-docker-pull.pid"
            LOG_FILE="${RUNNER_TEMP}/stellar-docker-pull.log"
            if [[ -f "${PID_FILE}" ]]; then
              pid="$(cat "${PID_FILE}")"
              echo "Waiting for docker pull ${IMAGE} (pid ${pid})"
              while kill -0 "${pid}" 2>/dev/null; do
                sleep 2
              done
              echo "Background docker pull finished"
              cat "${LOG_FILE}" || true
            fi
            if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "Image missing after background pull; retrying docker pull ${IMAGE}"
              docker pull "${IMAGE}"
            fi
            docker image inspect "${IMAGE}" --format 'stellar image ready: {{.Id}} {{json .RepoTags}}'

      - name: Run E2E tests
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        run: ${{ inputs.test-command }} --retries 1
        env:
          # The properties are picked up by mocha-junit-reporter and added to the XML test results
          PROPERTIES: 'JOB_NAME:${{ env.JOB_NAME }},JOB_ID:${{ job.check_run_id }},RUN_ID:${{ env.RUN_ID }},PR_NUMBER:${{ env.PR_NUMBER }}'
          # On re-run, pass the path to previous results to run only failed tests
          PREVIOUS_RESULTS_PATH: ${{ steps.download-previous-results.outcome == 'success' && './previous-test-results/test/test-results/e2e' || '' }}

      - name: Annotate changed/new E2E test failures
        if: ${{ failure() }}
        # Convert runner-local JUnit results into the structured marker that
        # status gating and workflow-run triage use to withhold retries.
        run: yarn tsx .github/scripts/emit-e2e-quality-gate-annotations.mts

      # Merge previous test results with current results to preserve pass/fail history across re-runs.
      # Without this, tests that passed in attempt N but were skipped in attempt N+1 would have no
      # results in the artifact, causing them to be re-run in attempt N+2.
      - name: Merge previous test results (on re-run)
        if: ${{ !cancelled() && github.run_attempt > 1 && steps.download-previous-results.outcome == 'success' }}
        run: yarn tsx .github/scripts/merge-test-results.mts ./previous-test-results/test/test-results/e2e ./test/test-results/e2e

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.JOB_NAME }}
          path: ${{ inputs.test-artifacts-path }}
