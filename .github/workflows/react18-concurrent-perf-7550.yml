name: React 18 concurrent perf (#7550 scratch)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which benchmark scenario(s) to run
        type: choice
        default: all
        options:
          - all
          - token-search-power-user
          - account-switch
      iterations:
        description: Iterations per arm (before + after)
        type: choice
        default: '20'
        options:
          - '20'
          - '40'
      prior_run_id:
        description: >-
          Optional Actions run ID — download scratch-7550-* JSON from that run
          before this run's artifacts (for scenarios skipped when scenario != all).
          Example: 35742151915
        required: false
        type: string
  push:
    branches:
      - test/7550-react-18-performance

permissions:
  contents: read
  actions: read

concurrency:
  group: react18-concurrent-perf-7550-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHMARK_RETRIES: 1
  PRE_7475_SHA: 23a9a0e2284fb7aa2e8fc51cb40553f93249ed30
  PRE_7476_SHA: 384fb12684915651d4a82f6344de354309a9ed01

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      benchmark_iterations: ${{ steps.set-matrix.outputs.benchmark_iterations }}
    steps:
      - id: set-matrix
        env:
          SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'all' }}
          ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.iterations || '20' }}
          PRE_7475_SHA: ${{ env.PRE_7475_SHA }}
          PRE_7476_SHA: ${{ env.PRE_7476_SHA }}
        run: |
          case "$SCENARIO" in
            token-search-power-user)
              MATRIX=$(jq -nc --arg sha "$PRE_7475_SHA" \
                '{include:[{scenario:"token-search-power-user",before_sha:$sha}]}')
              ;;
            account-switch)
              MATRIX=$(jq -nc --arg sha "$PRE_7476_SHA" \
                '{include:[{scenario:"account-switch",before_sha:$sha}]}')
              ;;
            *)
              MATRIX=$(jq -nc \
                --arg t "$PRE_7475_SHA" \
                --arg a "$PRE_7476_SHA" \
                '{include:[{scenario:"token-search-power-user",before_sha:$t},{scenario:"account-switch",before_sha:$a}]}')
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "benchmark_iterations=$ITERATIONS" >> "$GITHUB_OUTPUT"

  build-test-webpack:
    name: build-test-webpack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TZ: UTC
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Run tsc
        run: yarn webpack:tsc

      - name: Run build
        run: yarn build:test --zip

      - name: Validate source maps
        run: yarn validate-source-maps

      - name: Upload artifact 'build-test-webpack'
        uses: actions/upload-artifact@v4
        with:
          name: build-test-webpack
          path: |
            builds
            dist

  benchmark:
    name: benchmark / ${{ matrix.scenario }}
    needs:
      - prepare
      - build-test-webpack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      SELENIUM_BROWSER: chrome
      SELENIUM_HEADLESS: true
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
      SKIP_AFTER_BUILD: 1
      BENCHMARK_ABORT_AFTER_CONSECUTIVE_FAILURES: 3
      BENCHMARK_ITERATIONS: ${{ needs.prepare.outputs.benchmark_iterations }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          fetch-depth: 0
          skip-allow-scripts: true

      - name: Download artifact 'build-test-webpack'
        uses: actions/download-artifact@v4
        with:
          name: build-test-webpack

      - name: Run tsc
        run: yarn webpack:tsc

      - name: Install Foundry (anvil)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Run scenario before/after
        run: |
          chmod +x test/e2e/benchmarks/scratch-7550/run-scenario-comparison.sh
          ./test/e2e/benchmarks/scratch-7550/run-scenario-comparison.sh \
            "${{ matrix.scenario }}" \
            "${{ matrix.before_sha }}" \
            test-artifacts/scratch-7550

      - name: Upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-7550-${{ matrix.scenario }}
          path: test-artifacts/scratch-7550/benchmark-chrome-webpack-*.json
          if-no-files-found: error

      - name: Upload failure DOM and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-7550-${{ matrix.scenario }}-failure-artifacts
          path: test-artifacts/chrome
          if-no-files-found: ignore

  report:
    name: merge + report
    needs:
      - prepare
      - benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.benchmark.result != 'cancelled'
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download prior scenario artifacts (optional)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.prior_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: scratch-7550-*
          merge-multiple: true
          path: test-artifacts/scratch-7550
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.prior_run_id }}

      - name: Download scenario artifacts (this run)
        uses: actions/download-artifact@v4
        with:
          pattern: scratch-7550-*
          merge-multiple: true
          path: test-artifacts/scratch-7550

      - name: Merge results and generate report
        run: |
          chmod +x test/e2e/benchmarks/scratch-7550/merge-for-report.sh
          ./test/e2e/benchmarks/scratch-7550/merge-for-report.sh test-artifacts/scratch-7550

      - name: Summary
        if: always()
        run: |
          {
            echo '### React 18 concurrent perf report'
            if [ -f test-artifacts/scratch-7550/react18-concurrent-perf-report.md ]; then
              cat test-artifacts/scratch-7550/react18-concurrent-perf-report.md
            else
              echo 'Report not generated — one or more benchmark jobs may have failed.'
            fi
            if [ -n "${{ github.event_name == 'workflow_dispatch' && inputs.prior_run_id || '' }}" ]; then
              echo ''
              echo "_Merged with prior run \`${{ inputs.prior_run_id }}\` for skipped scenario(s)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scratch-7550 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-7550-report
          path: test-artifacts/scratch-7550/
          if-no-files-found: ignore
