name: Build storybook

on:
  workflow_call:

jobs:
  build-storybook:
    name: Build storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'default-branch' || null }}
    permissions:
      id-token: write
      contents: read
    env:
      # For a `pull_request` event, the branch is `github.head_ref``.
      # For a `push` event, the branch is `github.ref_name`.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: ${{ github.ref_name == 'main' || github.ref_name == 'stable' || startsWith(github.ref_name, 'release/') }}
          skip-allow-scripts: true

      - name: Build storybook
        run: yarn storybook:build

      - name: Upload 'storybook-build' to S3
        if: ${{ vars.AWS_REGION && vars.AWS_IAM_ROLE && vars.AWS_S3_BUCKET }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@7e0d74bc7b79ce9601e52f58d5e4d36c19591df9 # v1.19.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/storybook-build
          path: storybook-build

      - name: Get token
        id: token
        if: ${{ env.BRANCH == 'main' }}
        uses: MetaMask/github-tools/.github/actions/get-token@7e0d74bc7b79ce9601e52f58d5e4d36c19591df9 # v1.19.0
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/metamask-storybook
          permissions: |
            contents: write

      - name: Deploy storybook
        if: ${{ env.BRANCH == 'main' }}
        env:
          STORYBOOK_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote add storybook "https://x-access-token:${STORYBOOK_TOKEN}@github.com/MetaMask/metamask-storybook.git"
          yarn storybook:deploy
