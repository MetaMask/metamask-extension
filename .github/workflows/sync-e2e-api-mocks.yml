name: Sync E2E API Mocks

# Aligns the E2E API mock fixtures with the live response shapes. See
# test/e2e/mock-response-data/api-mock-catalog.md.
#
# Mondays (and workflow_dispatch): open or update one PR when a fixture changes.
# Same-repo pull requests that touch the mocks: commit any drift to that branch.
# Fork pull requests are skipped. A fetch failure does not fail a pull request.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - test/e2e/mock-e2e.js
      - test/e2e/mock-response-data/**
      - test/e2e/mock-cdn/ppom-version.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-e2e-api-mocks-${{ github.event.pull_request.number || github.run_id }}
  # Do not cancel the run that just pushed. Its follow-up sees the bot commit
  # and skips, so this run must finish and post the comment.
  cancel-in-progress: false

jobs:
  sync-e2e-api-mocks:
    name: Align E2E API mocks with live responses
    # No environment on pull requests: its secrets may be unavailable, and the
    # sync skips those rows instead of failing. Forks are not this repository.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    environment: ${{ github.event_name != 'pull_request' && 'default-branch' || null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true
          # pull_request otherwise checks out the merge commit, which cannot
          # be pushed back to the head branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Skip the bot's own sync commit
        id: bot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          AUTHOR="$(git log -1 --format='%an')"
          SUBJECT="$(git log -1 --format='%s')"
          if [ "${AUTHOR}" = "github-actions[bot]" ] &&
            [ "${SUBJECT}" = "test: align E2E API mocks with live response shapes" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Head commit is the bot sync commit; not running again."
          fi

      - name: Align fixtures
        id: sync
        if: steps.bot.outputs.skip != 'true'
        shell: bash
        env:
          CONTENTFUL_ACCESS_SPACE_ID: ${{ secrets.CONTENTFUL_ACCESS_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          set +e
          yarn test:e2e:sync-api-mocks 2>&1 | tee sync-report.txt
          EXIT="${PIPESTATUS[0]}"
          set -e
          echo "EXIT=${EXIT}" >> "${GITHUB_OUTPUT}"
          # 0: no drift (one line, no summary, nothing committed).
          # 1: fixtures written. 2: a fetch failed and nothing was written.
          if [ "${EXIT}" -ne 0 ]; then
            cat sync-report.txt >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Logged above. A fetch failure must not fail the pull request.
            [ "${EXIT}" -le 2 ]
          else
            [ "${EXIT}" -le 1 ]
          fi

      - name: Commit fixtures to this pull request
        id: pr-commit
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.sync.outputs.EXIT == '1'
          }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "test: align E2E API mocks with live response shapes"
          # Fast-forward only, so a commit pushed while this ran is not overwritten.
          # The checkout token is used. Token exchange denies a write token for
          # this repository, so an app token cannot replace it.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "number=${{ github.event.pull_request.number }}" >> "${GITHUB_OUTPUT}"

      - name: Open or update the review PR
        id: weekly
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            steps.sync.outputs.EXIT == '1'
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/e2e-api-mocks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add -u
          git commit -m "test: align E2E API mocks with live response shapes"
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
            # The checkout is a shallow clone of main, so the lease ref does
            # not exist until this fetch.
            git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}"
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push -u origin "HEAD:refs/heads/${BRANCH}"
          fi
          {
            echo "Weekly shape sync of the E2E API mocks. Values the tests assert are pinned in code."
            echo
            echo '```'
            cat sync-report.txt
            echo '```'
          } > pr-body.md
          EXISTING="$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number')"
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --body-file pr-body.md
            NUMBER="${EXISTING}"
          else
            URL="$(gh pr create --base main --head "${BRANCH}" --title "test: align E2E API mocks with live response shapes" --body-file pr-body.md)"
            NUMBER="$(gh pr view "${URL}" --json number --jq .number)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "number=${NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Comment that the mocks were updated
        if: steps.pr-commit.outputs.sha != '' || steps.weekly.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-commit.outputs.number || steps.weekly.outputs.number }}
          COMMIT_SHA: ${{ steps.pr-commit.outputs.sha || steps.weekly.outputs.sha }}
        run: |
          MARKER="<!-- e2e-api-mock-sync -->"
          jq -n \
            --rawfile report sync-report.txt \
            --arg marker "${MARKER}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" \
            '{body: ($marker + "\nUpdated the E2E API mocks on this pull request. The change is shape-only: existing values stay, new fields are placeholders, and removed fields are dropped.\n\nCommit: " + $url + "\n\n```\n" + $report + "```\n")}' \
            > comment.json
          COMMENT_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)"
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input comment.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input comment.json
          fi
