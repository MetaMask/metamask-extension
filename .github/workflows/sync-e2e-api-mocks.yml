name: Sync E2E API Mocks

# Aligns the E2E API mock fixtures with the live response shapes and opens a
# PR when they drift. See test/e2e/mock-response-data/api-mock-catalog.md.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-e2e-api-mocks:
    name: Align E2E API mocks with live responses
    environment: default-branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Align fixtures
        id: sync
        shell: bash
        env:
          CONTENTFUL_ACCESS_SPACE_ID: ${{ secrets.CONTENTFUL_ACCESS_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          set +e
          yarn test:e2e:sync-api-mocks 2>&1 | tee sync-report.txt
          EXIT="${PIPESTATUS[0]}"
          set -e
          echo "EXIT=${EXIT}" >> "${GITHUB_OUTPUT}"
          # 0: no drift (one line, no summary, no PR). 1: fixtures written.
          # 2: nothing written, a fetch failed.
          if [ "${EXIT}" -ne 0 ]; then
            cat sync-report.txt >> "${GITHUB_STEP_SUMMARY}"
          fi
          [ "${EXIT}" -le 1 ]

      - name: Open or update the review PR
        if: steps.sync.outputs.EXIT == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/e2e-api-mocks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          mapfile -t CHANGED < <(git diff --name-only)
          yarn prettier --write "${CHANGED[@]}"
          git add "${CHANGED[@]}"
          git commit -m "test: align E2E API mocks with live response shapes"
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
            # Shallow checkout: fetch the branch so the lease has a ref.
            git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}"
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" origin "${BRANCH}"
          else
            git push -u origin "${BRANCH}"
          fi
          {
            echo "Weekly shape sync of the E2E API mocks. Values the tests assert are pinned in code."
            echo
            echo '```'
            cat sync-report.txt
            echo '```'
          } > pr-body.md
          EXISTING="$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number')"
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --body-file pr-body.md
          else
            gh pr create --base main --head "${BRANCH}" --title "test: align E2E API mocks with live response shapes" --body-file pr-body.md
          fi
