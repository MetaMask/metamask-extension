# On every push to a release branch (release/x.y.z format), this workflow rebuilds the matching
# changelog branch, re-runs the auto-changelog script, and either updates or recreates the changelog PR.
#
# Note: GitHub Actions branch filters are glob-based (not regex), so we approximate SemVer by requiring
# three dot-separated segments that each start with a digit.
name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'
      - fix/release-changelog-oidc-token

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-checkout-auth:
    name: Test changelog token checkout
    if: github.ref_name == 'fix/release-changelog-oidc-token'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: read

      - name: Checkout with minted token
        uses: actions/checkout@v6
        with:
          token: ${{ steps.get-token.outputs.token }}

  refresh-changelog:
    name: Update changelog
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Get token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write
            workflows: write

      - name: Update Release Changelog
        uses: MetaMask/github-tools/.github/actions/update-release-changelog@v1
        with:
          release-branch: ${{ github.ref_name }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          platform: extension
          previous-version-ref: 'null'
          github-token: ${{ steps.get-token.outputs.token }}
