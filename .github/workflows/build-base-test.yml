name: Build the base commit's test build

# The paired benchmark jobs run the base commit's build beside the PR's. Called
# by main.yml only when no push run holds the base commit's build.
# A workflow of its own, since get-requirements.yml reads the build names a
# reused run must hold from every `build-name:` in main.yml, and this artifact
# exists only in the runs that needed it.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        description: The base commit to build

jobs:
  build-base-test-webpack:
    uses: ./.github/workflows/run-build.yml
    with:
      build-name: base-build-test-webpack
      build-command: yarn build:test --zip
      builds-from-run: ${{ github.run_id }}
      ref: ${{ inputs.ref }}
    secrets: inherit
