name: Run benchmarks

on:
  workflow_call:
    inputs:
      builds-from-run:
        required: true
        type: string
        description: The run ID to get builds from
      base-builds-from-run:
        required: false
        type: string
        default: ''
        description: >-
          The run ID to get the base commit's builds from. Set, each chrome job
          runs the base and head builds paired in one job (BENCHMARK_PAIRED,
          test/e2e/benchmarks/utils/paired.ts), once leading with each build
          (ADR 0072's paired comparator). Unset, every job runs the head build
          alone, as before.
      base-build-artifact-name:
        required: false
        type: string
        default: ''
        description: >-
          The artifact holding the base commit's build in that run. Empty is
          `build-test-<buildType>`, the name main's runs upload it under.

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  benchmarks:
    if: ${{ github.event_name != 'merge_group' }} # Skip this job for the Merge Queue
    name: ${{ matrix.browser }}-${{ matrix.buildType }}-${{ matrix.pairedOrder != '' && format('{0}-r{1}-{2}', matrix.pairedFlow.name, matrix.pairedRepeat, matrix.pairedOrder) || matrix.pageType }}
    # `quality-gate` decides, on main commits only
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Preset names are defined in test/e2e/benchmarks/utils/constants.ts
        # and must stay in sync with benchmark-command (startupPowerUserHome uses extra flags).
        #
        # Unset `base-builds-from-run`: every preset on both browsers. Set: admitted
        # flows run paired on Chrome only and the presets run the rest (see `skip`).
        # `getBenchmarkLegs` (paired-flows.ts) lists both; a test holds it equal to these.
        include: ${{ fromJSON(inputs.base-builds-from-run == '' && '[{"browser":"chrome","buildType":"webpack","pageType":"startupStandardHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"startupPowerUserHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"interactionUserActions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyOnboardingImport","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyOnboardingNew","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyAssets","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyTransactions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyAccountManagement","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"startupStandardHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"startupPowerUserHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"interactionUserActions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyOnboardingImport","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyOnboardingNew","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyAssets","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyTransactions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyAccountManagement","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""}]' || '[{"browser":"chrome","buildType":"webpack","pageType":"startupPowerUserHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"interactionUserActions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":"test/e2e/benchmarks/flows/interaction/load-new-account.ts test/e2e/benchmarks/flows/interaction/bridge-user-actions.ts"},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyOnboardingImport","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyOnboardingNew","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyTransactions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"userJourneyAccountManagement","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"startupStandardHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"startupPowerUserHome","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"interactionUserActions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyOnboardingImport","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyOnboardingNew","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyAssets","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyTransactions","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"firefox","buildType":"webpack","pageType":"userJourneyAccountManagement","pairedFlow":"","pairedOrder":"","pairedRepeat":"","skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"bridgeUserActions","file":"test/e2e/benchmarks/flows/interaction/bridge-user-actions.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"bridgeUserActions","file":"test/e2e/benchmarks/flows/interaction/bridge-user-actions.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"bridgeUserActions","file":"test/e2e/benchmarks/flows/interaction/bridge-user-actions.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"bridgeUserActions","file":"test/e2e/benchmarks/flows/interaction/bridge-user-actions.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"startupStandardHome","file":"test/e2e/benchmarks/flows/startup/standard-home.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"startupStandardHome","file":"test/e2e/benchmarks/flows/startup/standard-home.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"startupStandardHome","file":"test/e2e/benchmarks/flows/startup/standard-home.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"startupStandardHome","file":"test/e2e/benchmarks/flows/startup/standard-home.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"assetDetails","file":"test/e2e/benchmarks/flows/user-journey/asset-details.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"assetDetails","file":"test/e2e/benchmarks/flows/user-journey/asset-details.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"assetDetails","file":"test/e2e/benchmarks/flows/user-journey/asset-details.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"assetDetails","file":"test/e2e/benchmarks/flows/user-journey/asset-details.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"solanaAssetDetails","file":"test/e2e/benchmarks/flows/user-journey/solana-asset-details.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"solanaAssetDetails","file":"test/e2e/benchmarks/flows/user-journey/solana-asset-details.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"solanaAssetDetails","file":"test/e2e/benchmarks/flows/user-journey/solana-asset-details.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"solanaAssetDetails","file":"test/e2e/benchmarks/flows/user-journey/solana-asset-details.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"loadNewAccount","file":"test/e2e/benchmarks/flows/interaction/load-new-account.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"loadNewAccount","file":"test/e2e/benchmarks/flows/interaction/load-new-account.ts"},"pairedOrder":"base-head-head-base","pairedRepeat":2,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"loadNewAccount","file":"test/e2e/benchmarks/flows/interaction/load-new-account.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":1,"skip":""},{"browser":"chrome","buildType":"webpack","pageType":"","pairedFlow":{"name":"loadNewAccount","file":"test/e2e/benchmarks/flows/interaction/load-new-account.ts"},"pairedOrder":"head-base-base-head","pairedRepeat":2,"skip":""}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SELENIUM_BROWSER: ${{ matrix.browser }}
      SELENIUM_HEADLESS: true
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'none' }}
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
      # main or release/* only — for S3 / AWS CLI (same ref semantics as Sentry).
      MAIN_OR_RELEASE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      # The job's results file. A paired job's name carries its repeat and order,
      # so the jobs of one flow upload distinct artifacts.
      BENCHMARK_JSON: benchmark-${{ matrix.browser }}-${{ matrix.buildType }}-${{ matrix.pairedOrder != '' && format('{0}-r{1}-{2}', matrix.pairedFlow.name, matrix.pairedRepeat, matrix.pairedOrder) || matrix.pageType }}.json
      # Paired jobs only. The head build goes to head-build/ and the base build
      # to base-build/, and `dist` is left absent: the runner points it at each
      # build in turn. Unpaired, BENCHMARK_PAIRED is empty, which is off.
      BENCHMARK_PAIRED: ${{ matrix.pairedOrder != '' && '1' || '' }}
      BENCHMARK_PAIRED_ORDER: ${{ matrix.pairedOrder }}
      BENCHMARK_PAIRED_BASE_DIST: base-build/dist
      BENCHMARK_PAIRED_HEAD_DIST: head-build/dist
      # Paired jobs only: each run's iterations, the runner's `--iterations`.
      # 5 is the runner's default.
      BENCHMARK_PAIRED_ITERATIONS: '5'
      # Paired startup jobs only: each run's browser loads, of 10 page loads.
      BENCHMARK_PAIRED_BROWSER_LOADS: '4'
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Install anvil with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test${{ matrix.browser == 'firefox' && '-mv2' || '' }}-${{ matrix.buildType }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.builds-from-run }}
          path: ${{ matrix.pairedOrder != '' && 'head-build' || github.workspace }}

      - name: Download the base commit's build artifact (paired jobs only)
        if: ${{ matrix.pairedOrder != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.base-build-artifact-name || format('build-test-{0}', matrix.buildType) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.base-builds-from-run }}
          path: base-build

      - name: Pin geckodriver 0.36.0 (Firefox only)
        if: ${{ matrix.browser == 'firefox' }}
        run: .github/scripts/pin-geckodriver.sh

      - name: Run the benchmark
        # Job timeouts propogate to later jobs, step timeouts just cause job failure.
        # This must be set below the job timeout so that the job itself does not timeout.
        timeout-minutes: 25
        id: run-benchmark
        run: >-
          ${{ matrix.pageType == 'startupPowerUserHome' && format('yarn test:e2e:benchmark --preset startupPowerUserHome --browserLoads 15 --pageLoads 7 --out test-artifacts/benchmarks/benchmark-{0}-{1}-startupPowerUserHome.json --retries 2', matrix.browser, matrix.buildType) || matrix.pairedOrder != '' && startsWith(matrix.pairedFlow.name, 'startup') && format('yarn test:e2e:benchmark {0} --browserLoads {1} --pageLoads 10 --out test-artifacts/benchmarks/{2} --retries 2', matrix.pairedFlow.file, env.BENCHMARK_PAIRED_BROWSER_LOADS, env.BENCHMARK_JSON) || matrix.pairedOrder != '' && format('yarn test:e2e:benchmark {0} --iterations {1} --out test-artifacts/benchmarks/{2} --retries 2', matrix.pairedFlow.file, env.BENCHMARK_PAIRED_ITERATIONS, env.BENCHMARK_JSON) || format('yarn test:e2e:benchmark --preset {0} --out test-artifacts/benchmarks/{1} --retries 2{2}', matrix.pageType, env.BENCHMARK_JSON, matrix.skip != '' && format(' --skip {0}', matrix.skip) || '') }}
        shell: bash

      - name: Send benchmark results to Sentry (main/release only)
        if: >-
          ${{
            vars.SENTRY_DSN_PERFORMANCE &&
            env.MAIN_OR_RELEASE == 'true'
          }}
        run: |
          export GITHUB_REF_NAME="${GH_HEAD_REF:-$GH_REF_NAME}"
          yarn tsx test/e2e/benchmarks/send-to-sentry.ts \
            --results "test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}" \
            --browser "${{ matrix.browser }}" \
            --buildType "${{ matrix.buildType }}"
        shell: bash
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}

      - name: Upload benchmark to S3
        if: >-
          ${{
            vars.AWS_REGION != '' &&
            vars.AWS_IAM_ROLE != '' &&
            vars.AWS_S3_BUCKET != ''
          }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/benchmarks/${{ env.BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}

      - name: Upload benchmark result as GitHub artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}
          retention-days: 7
          if-no-files-found: ignore

      # One job's two differences per series are too few to decide, so this
      # step checks that its results carry values and `quality-gate` decides
      # over every job of the flow.
      - name: Check this benchmark leg's results
        if: ${{ steps.run-benchmark.outcome == 'success' }}
        run: yarn tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current test-artifacts/benchmarks/ --leg
        shell: bash

  benchmarks-page-load:
    if: ${{ github.event_name != 'merge_group' }} # Skip this job for the Merge Queue
    name: chrome-webpack-pageLoadBenchmark
    # `quality-gate` decides, on main commits only
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'default-branch' || null }}
    env:
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'none' }}
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      # Job env mirrors matrix job; step `if:` uses env.SENTRY_DSN_PERFORMANCE (same as send-to-sentry’s process.env).
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      BENCHMARK_BROWSER_LOADS: '10'
      BENCHMARK_PAGE_LOADS: '10'
      DAPP_BENCHMARK_JSON: benchmark-chrome-webpack-pageLoadBenchmark.json
      MAIN_OR_RELEASE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download artifact 'build-test-webpack'
        uses: actions/download-artifact@v7
        with:
          name: build-test-webpack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.builds-from-run }}

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright-browsers
        with:
          browsers: chromium

      - name: Run dapp page load benchmarks
        # Job timeouts propogate to later jobs, step timeouts just cause job failure.
        # This must be set below the job timeout so that the job itself does not timeout.
        timeout-minutes: 25
        id: run-page-load
        run: yarn test:e2e:benchmark --preset=pageLoadBenchmark

      - name: Send benchmark results to Sentry (main/release only)
        if: >-
          ${{
            vars.SENTRY_DSN_PERFORMANCE &&
            env.MAIN_OR_RELEASE == 'true'
          }}
        run: |
          export GITHUB_REF_NAME="${GH_HEAD_REF:-$GH_REF_NAME}"
          yarn tsx test/e2e/benchmarks/send-to-sentry.ts \
            --results "test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}" \
            --browser "chrome" \
            --buildType "webpack"
        shell: bash
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}

      - name: Upload benchmark to S3
        if: >-
          ${{
            vars.AWS_REGION != '' &&
            vars.AWS_IAM_ROLE != '' &&
            vars.AWS_S3_BUCKET != ''
          }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}

      - name: Upload benchmark result as GitHub artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DAPP_BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Gate this benchmark leg
        if: ${{ steps.run-page-load.outcome == 'success' }}
        run: yarn tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current test-artifacts/benchmarks/
        shell: bash

  # Blocks on the series admitted under ADR 0072 (paired-decision.ts); every other
  # series and the THRESHOLD_REGISTRY limits are reported and never block.
  # Rollout across 4 phases:
  # - Phase 2: continue-on-error: true (non-blocking, informational).
  # - Phase 3: continue-on-error: false (red X in checks, not required).
  # - Phase 4: continue-on-error: false + added to branch protection required checks.
  quality-gate:
    name: quality-gate
    continue-on-error: false
    needs:
      - benchmarks
      - benchmarks-page-load
    # Decides on main commits, each paired against its first parent; pull
    # requests run the benchmarks unpaired and take no verdict.
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' && github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout quality-gate sources
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .nvmrc
            tsconfig.json
            development/metamaskbot-build-announce
            shared/constants/benchmarks.ts
            test/e2e/benchmarks/utils/gated-metrics.ts
            test/e2e/benchmarks/utils/paired-decision.ts
            test/e2e/benchmarks/utils/thresholds.ts
            test/e2e/benchmarks/utils/statistics.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install tsx and runtime deps
        run: npm install --no-save tsx @metamask/utils
        shell: bash

      - name: Download all benchmark artifacts
        id: download-benchmarks
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: benchmark-*.json
          path: benchmark-results/
          merge-multiple: true

      - name: Run quality gate
        if: ${{ steps.download-benchmarks.outcome == 'success' }}
        run: ./node_modules/.bin/tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current ./benchmark-results/ --paired
        shell: bash

      - name: Fail when the benchmark artifacts did not download
        if: ${{ steps.download-benchmarks.outcome != 'success' }}
        run: |
          echo '::error::The benchmark artifacts did not download, so the quality gate did not run'
          exit 1
        shell: bash

  # Pushes benchmark results to extension_benchmark_stats (performance_data.json) for
  # historical comparison in PR comments. Runs on main/release branch pushes only.
  # Skip on fork repos — only store stats on the canonical repository.
  store-benchmark-stats:
    name: store-benchmark-stats (main/release only)
    continue-on-error: true
    needs:
      - benchmarks
      - benchmarks-page-load
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        (github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/release/')) &&
        !github.event.repository.fork
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == github.event.repository.default_branch && 'default-branch' || 'release-ci' }}
    env:
      HEAD_COMMIT_HASH: ${{ github.sha }}
      OWNER: ${{ github.repository_owner }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all performance benchmark artifacts
        id: download-perf-benchmark
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: benchmark-*.json
          path: benchmark-results/
          merge-multiple: true

      - name: Get token
        id: token
        if: steps.download-perf-benchmark.outcome == 'success'
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/extension_benchmark_stats
          permissions: |
            contents: write

      - name: Commit performance stats to extension_benchmark_stats
        if: steps.download-perf-benchmark.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/benchmark-stats-commit.sh
        env:
          BENCHMARK_DATA_TYPE: performance
          BENCHMARK_RESULTS_DIR: benchmark-results
          EXTENSION_BENCHMARK_STATS_TOKEN: ${{ steps.token.outputs.token }}
