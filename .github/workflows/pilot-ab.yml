  R6_PAIRS: '[{"b":"37934631830","h":"37954282242","bv":"13.54.0","hv":"13.54.0"},{"b":"36792885075","h":"36801421053","bv":"13.52.0","hv":"13.52.0"},{"b":"39933617650","h":"39943387025","bv":"13.56.0","hv":"13.56.0"},{"b":"38847405707","h":"38877358283","bv":"13.55.0","hv":"13.55.0"},{"b":"38708572870","h":"38713402613","bv":"13.54.0","hv":"13.54.0"},{"b":"34106082381","h":"34112033440","bv":"13.49.0","hv":"13.49.0"},{"b":"40554476853","h":"40559133146","bv":"13.56.0","hv":"13.56.0"},{"b":"33400167613","h":"33408204941","bv":"13.48.0","hv":"13.48.0"},{"b":"37755203046","h":"37755522527","bv":"13.53.0","hv":"13.53.0"},{"b":"33888926021","h":"33895412330","bv":"13.48.0","hv":"13.48.0"},{"b":"40316126497","h":"40316549510","bv":"13.56.0","hv":"13.56.0"},{"b":"37819121166","h":"37835467610","bv":"13.53.0","hv":"13.53.0"},{"b":"38746033570","h":"38748662596","bv":"13.54.0","hv":"13.54.0"},{"b":"35219016329","h":"35219487363","bv":"13.50.0","hv":"13.50.0"},{"b":"34856319917","h":"34858491079","bv":"13.50.0","hv":"13.50.0"},{"b":"33555057648","h":"33561579982","bv":"13.48.0","hv":"13.48.0"},{"b":"36405524023","h":"36408528375","bv":"13.51.0","hv":"13.51.0"},{"b":"34601402590","h":"34601534373","bv":"13.49.0","hv":"13.49.0"},{"b":"36783098883","h":"36792610600","bv":"13.52.0","hv":"13.52.0"},{"b":"38792909794","h":"38806734203","bv":"13.54.0","hv":"13.54.0"},{"b":"36169375583","h":"36186285651","bv":"13.51.0","hv":"13.51.0"},{"b":"33905282800","h":"33912707490","bv":"13.48.0","hv":"13.48.0"},{"b":"38885698109","h":"38907079207","bv":"13.55.0","hv":"13.55.0"},{"b":"40824230443","h":"40844542936","bv":"13.56.0","hv":"13.56.0"},{"b":"36127586695","h":"36132186321","bv":"13.51.0","hv":"13.51.0"},{"b":"36849874496","h":"36857619737","bv":"13.52.0","hv":"13.52.0"},{"b":"42000842239","h":"42011072978","bv":"13.57.0","hv":"13.57.0"},{"b":"34852346817","h":"34854460537","bv":"13.50.0","hv":"13.50.0"},{"b":"41615315333","h":"41648002491","bv":"13.57.0","hv":"13.57.0"},{"b":"42069649