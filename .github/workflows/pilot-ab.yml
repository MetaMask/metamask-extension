name: Pilot A/B benchmarks

# TEMPORARY (1/1): same-machine two-build pilot. Runs only on trigger-ci-pilot*
# branches, which main.yml ignores. Each job runs two copies of one donor build
# that differ only in a manifest marker, alternating them between browser
# sessions. Results are uploaded as artifacts only: no Sentry, no gates.
# Remove this file and the main.yml branch exclusion when the pilot is done.
#
# Shards per browser: branch ending in -smoke gives 1, -s<N> gives N, anything
# else gives 50. The journey leg runs half as many shards (minimum 1).
#
# Round 2 (branches trigger-ci-pilot-r2*): StandardHome only, default 100
# shards per browser. Build B gets a busy-wait; shard s runs arm (s-1) % 4 with
# the duration from R2_INJECT_MS, and which build goes first alternates
# every 4 shards so each arm is balanced.
#
# Round 3 (branches trigger-ci-pilot-r3*): injection-site test. StandardHome
# only, default 100 shards per browser. Build B gets the same busy-wait
# (Chrome 76 ms, Firefox 125 ms) in arm 0: none, 1: first script, 2: middle
# script, 3: last script; order alternates as in round 2.
#
# Round 4 (branches trigger-ci-pilot-r4*): how much early work Firefox hides.
# Firefox only, default 100 shards; shard s runs arm (s - 1) % 5 from R4_ARMS
# (milliseconds and zero-based script index), order alternating every 5
# shards.
#
# Round 5 (branches trigger-ci-pilot-r5*): identical builds (A/A) with 20
# sessions per job instead of 10, both browsers, default 100 shards per
# browser, order alternating by shard. Compares the noise of one 20-session
# job with two 10-session jobs from round 1.
#
# Round 6 (branches trigger-ci-pilot-r6*): real base and head pairs. A run
# covers batch R6_BATCH of R6_BATCH_SIZE pairs from R6_PAIRS, R6_SHARDS shards
# per browser each. Build A is the base and build B is the head, both test
# builds of main runs downloaded from CloudFront, so the two differ in real
# code and layout. StandardHome only. Order alternates with shard + pair index.
# To run the next batch, change R6_BATCH and push.

on:
  push:
    branches:
      - 'trigger-ci-pilot*'

permissions:
  contents: read
  actions: read

env:
  # Donor run whose build artifacts both pilot builds are copied from.
  BENCHMARK_BUILDS_FROM_RUN: '39498044798'
  BENCHMARK_AB_PILOT: '1'
  # Session order; a random per-job flip swaps which build goes first.
  BENCHMARK_AB_SEQUENCE: ABBABAABAB
  # Round 6 pairs: CloudFront run IDs of each base (b) and head (h) test build
  # and the manifest version of each (bv, hv), a seeded random sample of
