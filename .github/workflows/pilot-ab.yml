"13.54.0","hv":"13.54.0"},{"b":"37835467610","h":"37844569599","bv":"13.53.0","hv":"13.53.0"},{"b":"40666412434","h":"40667097365","bv":"13.56.0","hv":"13.56.0"},{"b":"41971966647","h":"41977292884","bv":"13.57.0","hv":"13.57.0"},{"b":"34333511182","h":"34334066536","bv":"13.49.0","hv":"13.49.0"},{"b":"34915558198","h":"34934848357","bv":"13.50.0","hv":"13.50.0"},{"b":"39628576873","h":"39634210022","bv":"13.55.0","hv":"13.55.0"},{"b":"34651797279","h":"34654143982","bv":"13.50.0","hv":"13.50.0"},{"b":"38399451870","h":"38400792801","bv":"13.54.0","hv":"13.54.0"},{"b":"34259184064","h":"34259501513","bv":"13.49.0","hv":"13.49.0"},{"b":"41713911512","h":"41736810667","bv":"13.57.0","hv":"13.57.0"},{"b":"39623244819","h":"39627248488","bv":"13.55.0","hv":"13.55.0"},{"b":"36019364456","h":"36022054667","bv":"13.51.0","hv":"13.51.0"},{"b":"39565922570","h":"39578037713","bv":"13.55.0","hv":"13.55.0"},{"b":"38287295808","h":"38348449388","bv":"13.54.0","hv":"13.54.0"},{"b":"41491667507","h":"41498366219","bv":"13.56.0","hv":"13.56.0"},{"b":"40513032385","h":"40513687978","bv":"13.56.0","hv":"13.56.0"},{"b":"40698226466","h":"40709148037","bv":"13.56.0","hv":"13.56.0"},{"b":"34184108169","h":"34209161367","bv":"13.49.0","hv":"13.49.0"},{"b":"34146408711","h":"34147432569","bv":"13.49.0","hv":"13.49.0"},{"b":"34625531467","h":"34627429025","bv":"13.49.0","hv":"13.50.0"},{"b":"36836288966","h":"36845399415","bv":"13.52.0","hv":"13.52.0"},{"b":"38918860441","h":"38926009940","bv":"13.55.0","hv":"13.55.0"},{"b":"36002520914","h":"36003872699","bv":"13.51.0","hv":"13.51.0"},{"b":"39435407807","h":"39438069452","bv":"13.55.0","hv":"13.55.0"},{"b":"34342226991","h":"34343353641","bv":"13.49.0","hv":"13.49.0"},{"b":"33415594330","h":"33421990451","bv":"13.48.0","hv":"13.48.0"},{"b":"34122187666","h":"34123264744","bv":"13.49.0","hv":"13.49.0"},{"b":"39591287066","h":"39600184629","bv":"13.55.0","hv":"13.55.0"},{"b":"38261417882","h":"38265976777","bv":"13.54.0","hv":"13.54.0"},{"b":"37755522527","h":"37756245378","bv":"13.53.0","hv":"13.53.0"},{"b":"35615997976","h":"35619751786","bv":"13.51.0","hv":"13.51.0"},{"b":"34868938991","h":"34870154631","bv":"13.50.0","hv":"13.50.0"},{"b":"39668694300","h":"39672502678","bv":"13.55.0","hv":"13.55.0"},{"b":"35376811367","h":"35377377776","bv":"13.51.0","hv":"13.51.0"},{"b":"40577265267","h":"40580679091","bv":"13.56.0","hv":"13.56.0"},{"b":"34627429025","h":"34647942844","bv":"13.50.0","hv":"13.50.0"},{"b":"35938062907","h":"35942494143","bv":"13.51.0","hv":"13.51.0"},{"b":"40715453495","h":"40716531034","bv":"13.56.0","hv":"13.56.0"},{"b":"36022054667","h":"36024439595","bv":"13.51.0","hv":"13.51.0"},{"b":"40033856323","h":"40086226005","bv":"13.56.0","hv":"13.56.0"},{"b":"34359045084","h":"34364006273","bv":"13.49.0","hv":"13.49.0"}]'
  R6_BATCH: '4'
  R6_BATCH_SIZE: '20'
  R6_SHARDS: '5'
  R6_HOST: 'https://diuv6g5fj9pvx.cloudfront.net/metamask-extension'
  # Round 2 busy-wait milliseconds per arm, about 2, 4 and 8% of median
  # uiStartup (arm 0 is the hook with no work).
  R2_INJECT_MS: '{"chrome": [0, 19, 38, 76], "firefox": [0, 31, 62, 125]}'
  # Round 3 busy-wait milliseconds and injection site per arm.
  R3_INJECT_MS: '{"chrome": 76, "firefox": 125}'
  R3_SITES: '["last", "first", "middle", "last"]'
  # Round 4 arms: busy-wait milliseconds and which home.html script gets it.
  R4_ARMS: '[{"ms": 0, "site": "last"}, {"ms": 250, "site": "0"}, {"ms": 125, "site": "1"}, {"ms": 125, "site": "3"}, {"ms": 125, "site": "7"}]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      round: ${{ steps.matrix.outputs.round }}
    steps:
      - name: Build the shard matrix
        id: matrix
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          round=1
          default=50
          if [[ "$BRANCH_NAME" == trigger-ci-pilot-r2* ]]; then
            round=2
            default=100
          elif [[ "$BRANCH_NAME" == trigger-ci-pilot-r3* ]]; then
            round=3
            default=100
          elif [[ "$BRANCH_NAME" == trigger-ci-pilot-r4* ]]; then
            round=4
            default=100
          elif [[ "$BRANCH_NAME" == trigger-ci-pilot-r5* ]]; then
            round=5
            default=100
          elif [[ "$BRANCH_NAME" == trigger-ci-pilot-r6* ]]; then
            round=6
            default=100
          fi
          if [[ "$BRANCH_NAME" =~ -smoke$ ]]; then
            shards=1
          elif [[ "$BRANCH_NAME" =~ -s([0-9]+)$ ]]; then
            shards="${BASH_REMATCH[1]}"
          else
            shards=$default
          fi
          if (( shards < 1 || shards > 100 )); then
            echo "::error::Shards per browser must be 1 to 100, got $shards"
            exit 1
          fi
          if (( round == 2 )); then
            matrix=$(jq -nc --argjson s "$shards" --argjson ms "$R2_INJECT_MS" '
              {include: [
                ("chrome", "firefox") as $browser
                | range(1; $s + 1) as $shard
                | (($shard - 1) % 4) as $arm
                | {browser: $browser, pageType: "startupStandardHome",
                   shard: $shard, arm: $arm,
                   flip: (((($shard - 1) / 4) | floor) % 2),
                   injectMs: $ms[$browser][$arm],
                   suffix: "-arm\($arm)",
                   injectArg: "--inject-ms \($ms[$browser][$arm])"}
              ]}')
            echo "Round 2: $shards shards per browser, arm = (shard - 1) % 4"
          elif (( round == 3 )); then
            matrix=$(jq -nc --argjson s "$shards" --argjson ms "$R3_INJECT_MS" \
              --argjson sites "$R3_SITES" '
              {include: [
                ("chrome", "firefox") as $browser
                | range(1; $s + 1) as $shard
                | (($shard - 1) % 4) as $arm
                | (if $arm == 0 then 0 else $ms[$browser] end) as $inject
                | {browser: $browser, pageType: "startupStandardHome",
                   shard: $shard, arm: $arm,
                   flip: (((($shard - 1) / 4) | floor) % 2),
                   injectMs: $inject,
                   suffix: "-arm\($arm)-\($sites[$arm])",
                   injectArg: "--inject-ms \($inject) --inject-site \($sites[$arm])"}
              ]}')
            echo "Round 3: $shards shards per browser, arm = (shard - 1) % 4"
          elif (( round == 4 )); then
            matrix=$(jq -nc --argjson s "$shards" --argjson arms "$R4_ARMS" '
              {include: [
                "firefox" as $browser
                | range(1; $s + 1) as $shard
                | (($shard - 1) % ($arms | length)) as $arm
                | $arms[$arm] as $a
                | {browser: $browser, pageType: "startupStandardHome",
                   shard: $shard, arm: $arm,
                   flip: (((($shard - 1) / ($arms | length)) | floor) % 2),
                   injectMs: $a.ms,
                   suffix: "-arm\($arm)-s\($a.site)-\($a.ms)ms",
                   injectArg: "--inject-ms \($a.ms) --inject-site \($a.site)"}
              ]}')
            echo "Round 4: $shards Firefox shards, arm = (shard - 1) % 5"
          elif (( round == 5 )); then
            matrix=$(jq -nc --argjson s "$shards" '
              {include: [
                ("chrome", "firefox") as $browser
                | range(1; $s + 1) as $shard
                | {browser: $browser, pageType: "startupStandardHome",
                   shard: $shard, flip: (($shard - 1) % 2),
                   browserLoads: 20, suffix: "-aa20"}
              ]}')
            echo "Round 5: $shards shards per browser, 20 sessions per job"
          elif (( round == 6 )); then
            matrix=$(jq -nc --argjson s "$R6_SHARDS" --argjson size "$R6_BATCH_SIZE" \
              --argjson batch "$R6_BATCH" --argjson pairs "$R6_PAIRS" '
              {include: [
                range($batch * $size; ([($batch + 1) * $size, ($pairs | length)] | min)) as $p
                | ("chrome", "firefox") as $browser
                | range(1; $s + 1) as $shard
                | {browser: $browser, pageType: "startupStandardHome",
                   shard: $shard, pair: $p, flip: (($shard + $p) % 2),
                   suffix: "-p\($p)",
                   sourceArg: "--base-source pair/base --head-source pair/head"}
              ]}')
            echo "Round 6: batch $R6_BATCH, $R6_SHARDS shards per browser"
          else
            journey=$(( shards / 2 ))
            (( journey < 1 )) && journey=1
            matrix=$(jq -nc --argjson s "$shards" --argjson j "$journey" '
              {include: [
                ("chrome", "firefox") as $browser
                | ({pageType: "startupStandardHome", n: $s},
                   {pageType: "userJourneyOnboardingImport", n: $j}) as $leg
                | range(1; $leg.n + 1) as $shard
                | {browser: $browser, pageType: $leg.pageType, shard: $shard}
              ]}')
            echo "Shards per browser: $shards (journey $journey)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "round=$round" >> "$GITHUB_OUTPUT"

  pilot:
    needs: plan
    name: ${{ matrix.browser }}-${{ matrix.pageType }}-${{ matrix.shard }}${{ matrix.suffix }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      SELENIUM_BROWSER: ${{ matrix.browser }}
      SELENIUM_HEADLESS: true
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
      BRANCH: ${{ github.ref_name }}
      HEAD_COMMIT_HASH: ${{ github.sha }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      BENCHMARK_RUNNER_LABEL: ubuntu-26.04
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Install anvil with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Download donor build artifact
        if: ${{ needs.plan.outputs.round != '6' }}
        uses: actions/download-artifact@v7
        with:
          name: build-test${{ matrix.browser == 'firefox' && '-mv2' || '' }}-webpack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.BENCHMARK_BUILDS_FROM_RUN }}

      - name: Download the base and head builds
        if: ${{ needs.plan.outputs.round == '6' }}
        env:
          BROWSER: ${{ matrix.browser }}
          PAIR: ${{ matrix.pair }}
        run: |
          set -euo pipefail
          pair=$(jq -c --argjson i "$PAIR" '.[$i] + {index: $i}' <<< "$R6_PAIRS")
          for side in base head; do
            run=$(jq -r --arg s "$side" 'if $s == "base" then .b else .h end' <<< "$pair")
            version=$(jq -r --arg s "$side" 'if $s == "base" then .bv else .hv end' <<< "$pair")
            if [[ "$BROWSER" == firefox ]]; then
              path="build-test-mv2-webpack/builds/metamask-firefox-$version.zip"
            else
              path="build-test-webpack/builds/metamask-chrome-$version.zip"
            fi
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --output "$side.zip" "$R6_HOST/$run/$path"
            mkdir -p "pair/$side"
            unzip -q "$side.zip" -d "pair/$side"
          done
          mkdir -p test-artifacts/benchmarks
          echo "$pair" > "test-artifacts/benchmarks/pair-$BROWSER.json"

      - name: Pin geckodriver 0.36.0 (Firefox only)
        if: ${{ matrix.browser == 'firefox' }}
        run: .github/scripts/pin-geckodriver.sh

      - name: Prepare the A and B builds
        run: >-
          yarn tsx test/e2e/benchmarks/prepare-ab-builds.ts
          --browser ${{ matrix.browser }}
          ${{ matrix.sourceArg || format('--source dist/{0}', matrix.browser) }}
          --out test-artifacts/benchmarks/ab-builds-${{ matrix.browser }}-${{ matrix.pageType }}-s${{ matrix.shard }}.json
          ${{ matrix.injectArg }}

      - name: Choose which build goes first
        env:
          MATRIX_FLIP: ${{ matrix.flip }}
        run: echo "BENCHMARK_AB_FLIP=${MATRIX_FLIP:-$((RANDOM % 2))}" >> "$GITHUB_ENV"

      - name: Run the A/B benchmark
        timeout-minutes: 35
        run: >-
          yarn test:e2e:benchmark
          --preset ${{ matrix.pageType }}
          ${{ matrix.pageType == 'startupStandardHome' && format('--browserLoads {0} --pageLoads 10', matrix.browserLoads || 10) || '--iterations 10' }}
          --retries 2
          --out test-artifacts/benchmarks/benchmark-${{ matrix.browser }}-webpack-${{ matrix.pageType }}-s${{ matrix.shard }}.json

      - name: Upload pilot result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pilot-${{ matrix.browser }}-${{ matrix.pageType }}-s${{ matrix.shard }}${{ needs.plan.outputs.round == '6' && matrix.suffix || '' }}
          path: test-artifacts/benchmarks/*.json
          retention-days: 7
          if-no-files-found: ignore
