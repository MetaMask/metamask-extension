name: Main

on:
  push:
    branches:
      - main
      - stable
      - release/*
      - trigger-ci-*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches-ignore:
      - stable
  merge_group:
  schedule:
    # Run the full suite "overnight," once every hour from 2:00am UTC until 5:59am UTC.
    # This helps with "Top 10 failed tests on the metamask-extension repository main branch,"
    # especially the Monday morning list, which is otherwise usually a fake empty.
    - cron: '0 2-6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ !(contains(github.ref, 'refs/heads/main') || contains(github.ref, 'refs/heads/stable')) }}

env:
  # For a `pull_request` event, the branch is `github.head_ref`.
  # For a `push` event, the branch is `github.ref_name`.
  BRANCH: ${{ github.head_ref || github.ref_name }}
  # For a `pull_request` event, the head commit hash is `github.event.pull_request.head.sha`.
  # For a `push` event, the head commit hash is `github.sha`.
  HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
  RUN_ID: ${{ github.run_id }}

permissions:
  contents: write # required for releases
  id-token: write # required for s3 uploads
  statuses: write # required for build-source-hash and ci-status-gate

jobs:
  get-requirements:
    name: Get workflow and job requirements
    uses: ./.github/workflows/get-requirements.yml

  locales-changed-only:
    name: Locales changed only checks
    needs:
      - get-requirements
    if: ${{ needs.get-requirements.outputs.needs-locales == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: lint:json (Prettier sort-json)
        run: yarn lint:json

      - name: lint:format (oxfmt)
        run: yarn lint:format

      - name: Verify locales
        run: yarn verify-locales --quiet

  prep-deps:
    name: Prepare dependencies
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' }}
    runs-on: ubuntu-latest
    needs:
      - get-requirements
    timeout-minutes: 30
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        id: checkout-and-setup
        with:
          is-high-risk-environment: ${{ github.ref_name == 'main' || github.ref_name == 'stable' || startsWith(github.ref_name, 'release/') }}
          cache-node-modules: true
          skip-allow-scripts: true

  lint:
    name: Lint
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' || needs.get-requirements.outputs.needs-lint == 'true' }}
    needs:
      - get-requirements
      - prep-deps
    uses: ./.github/workflows/lint.yml
    with:
      run-workflows: ${{ needs.get-requirements.outputs.skip-everything != 'true' && 'true' || 'false' }}
      run-code: ${{ needs.get-requirements.outputs.needs-lint }}

  repository-health-checks:
    name: Repository health checks
    needs:
      - get-requirements
      - prep-deps
    if: >-
      ${{
        !cancelled() &&
        !contains(needs.*.result, 'failure') &&
        (
          needs.get-requirements.outputs.skip-everything != 'true' ||
          needs.get-requirements.outputs.just-repository-health-checks == 'true'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for S3 upload of audit baseline
      issues: write # create tracking issues for new audit advisories
      actions: write # download baseline artifact + re-run health-checks to refresh baseline
      pull-requests: write # add retry-ci label when ambient CVEs block a yarn.lock PR
    env:
      # For a `pull_request` event, the branch is `github.head_ref`.
      # For a `push` event, the branch is `github.ref_name`.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_METAMASK_EXTENSION: ${{ secrets.SLACK_WEBHOOK_METAMASK_EXTENSION }}
      # True only when the PR head lives in a different repository (no secrets).
      IS_CROSS_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: ShellCheck Lint
        if: ${{ !cancelled() }}
        run: ./development/shellcheck.sh

      - name: Validate changelog
        if: ${{ !startsWith(env.BRANCH, 'release/') }}
        run: yarn lint:changelog

      - name: Validate release candidate changelog
        if: ${{ startsWith(env.BRANCH, 'release/') }}
        run: .github/scripts/validate-changelog-in-rc.sh

      - name: Lint lockfile
        if: ${{ !cancelled() }}
        run: yarn lint:lockfile

      - name: Lint console baseline
        if: ${{ !cancelled() }}
        run: yarn lint:baseline

      - name: Check yarn resolutions
        if: ${{ !cancelled() }}
        run: yarn --check-resolutions

      # --- Baseline download (PR, push-to-main, and cron) ---
      # When the download fails (first rollout, expired artifact, or cross-repo PR
      # with read-only token), NO_BASELINE=true tells the triage script to
      # fall back to the same criteria as the package.json `audit` script:
      #   yarn audit --environment production --severity moderate
      #
      # merge_group runs skip the diff entirely: by the time a PR enters the
      # merge queue it has already passed the diff check. Any new advisory
      # that appeared on main since then wasn't introduced by this PR and
      # will be surfaced by the next push-to-main run.
      #
      # schedule (cron) runs also diff against the latest baseline. This
      # catches newly published CVEs overnight — even when no code was pushed —
      # and sends a Slack alert. The cron schedule is defined in main.yml.
      - name: Audit -- find baseline run
        id: find-baseline-run
        if: >-
          ${{
            !cancelled()
            && (
              github.event_name == 'pull_request'
              || github.event_name == 'push'
              || github.event_name == 'schedule'
            )
          }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            // Artifact-first search: find the audit-baseline artifact from
            // the most recent main-branch run. Using the artifact API avoids
            // race conditions with re-runs — a re-run of an older run may
            // upload a newer artifact, but we always prefer the highest
            // run ID (latest workflow run) to stay on the newest commit.
            //
            // Security: filter to head_branch === 'main' so a PR branch
            // can never supply a poisoned baseline.
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'audit-baseline',
              per_page: 20,
            });
            const baseline = data.artifacts
              .filter(a => a.workflow_run?.head_branch === 'main')
              .sort((a, b) => b.workflow_run.id - a.workflow_run.id)[0];
            if (!baseline) {
              core.setFailed('No audit-baseline artifact found from a main-branch run');
              return;
            }
            const runId = baseline.workflow_run.id;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
            core.info(`Using baseline from run ${runId} (${runUrl})`);
            core.setOutput('run-id', String(runId));

      - name: Audit -- download baseline
        id: download-baseline
        if: ${{ !cancelled() && steps.find-baseline-run.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: audit-baseline
          path: .tmp
          run-id: ${{ steps.find-baseline-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit -- check for vulnerabilities
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          NO_BASELINE: ${{ steps.download-baseline.outcome != 'success' }}
        run: |
          mkdir -p .tmp
          yarn tsx .github/scripts/yarn-audit-and-triage.mts

      # --- Diff (runs when a real baseline was downloaded) ---
      # On push-to-main and cron this detects advisories introduced since the
      # last green build and sends a Slack notification. On PRs it fails the
      # check when new production moderate+ advisories are found.
      - name: Audit -- diff against baseline
        if: ${{ !cancelled() && steps.download-baseline.outcome == 'success' }}
        env:
          BASELINE_RUN_ID: ${{ steps.find-baseline-run.outputs.run-id }}
        run: |
          yarn tsx .github/scripts/yarn-audit-diff.mts

      # On push-to-main, rename the audit output to audit-baseline.json so the
      # uploaded artifact name matches what PR runs download to .tmp.
      - name: Audit -- rename baseline
        if: >-
          ${{
            !cancelled()
            && (github.event_name == 'push' || github.event_name == 'schedule')
            && github.ref == 'refs/heads/main'
          }}
        run: mv .tmp/audit-current.json .tmp/audit-baseline.json

      - name: Audit -- upload baseline artifact
        if: >-
          ${{
            !cancelled()
            && (github.event_name == 'push' || github.event_name == 'schedule')
            && github.ref == 'refs/heads/main'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: audit-baseline
          path: .tmp/audit-baseline.json

      - name: Audit -- upload baseline to S3
        if: >-
          ${{
            !cancelled()
            && (github.event_name == 'push' || github.event_name == 'schedule')
            && github.ref == 'refs/heads/main'
            && github.repository == 'MetaMask/metamask-extension'
            && vars.AWS_REGION
            && vars.AWS_IAM_ROLE
            && vars.AWS_S3_BUCKET
          }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/audit-baseline
          path: .tmp/audit-baseline.json

      - name: Detect yarn lock deduplications
        if: ${{ !cancelled() }}
        run: yarn dedupe --check

      - name: Run depcheck
        if: ${{ !cancelled() }}
        run: yarn depcheck

      - name: Validate allow-scripts config
        if: ${{ !cancelled() }}
        run: yarn allow-scripts auto

      - name: Check feature flag registry
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn tsx .github/scripts/check-feature-flag-registry.mts

      - name: Check working tree
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --exit-code; then
              echo "::error::Working tree dirty."
              exit 1
          fi

      - name: Run fitness functions
        if: ${{ !cancelled() && github.event_name == 'pull_request'}}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn fitness-functions ci

  storybook:
    name: Storybook
    needs:
      - get-requirements
      - prep-deps
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' }}
    uses: ./.github/workflows/storybook.yml
    with:
      run-test: ${{ needs.get-requirements.outputs.needs-storybook }}
      run-build: ${{ needs.get-requirements.outputs.builds-from-run == github.run_id && 'true' || 'false' }}
    secrets: inherit

  lavamoat-validate-policies:
    name: Validate LavaMoat policies
    needs:
      - get-requirements
      - prep-deps
    # LavaMoat policies are deterministic: same inputs (yarn.lock, source code,
    # build scripts, policy files) → same output. All these inputs are covered
    # by the build-source hash, so when builds are reused the policies are
    # guaranteed to be valid — re-validating is redundant.
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' && needs.get-requirements.outputs.builds-from-run == github.run_id }}
    uses: ./.github/workflows/validate-lavamoat-policies.yml

  # Webpack build groups (up to 3 runners: MV3, MV2, optional beta/flask). Each group
  # runs its builds sequentially on one runner (one checkout/tsc). Artifact names are
  # unchanged so E2E and publish keep working. MV3/MV2 stay split so Chrome E2E does not
  # wait on Firefox builds. beta/flask prod builds skip on pull_request (see
  # needs-beta-flask-builds in get-requirements.yml (skipped on feature PRs only).
  builds-mv3:
    name: Builds MV3
    needs:
      - get-requirements
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' }}
    uses: ./.github/workflows/builds-mv3.yml
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
    secrets: inherit

  builds-mv2:
    name: Builds MV2
    needs:
      - get-requirements
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' }}
    uses: ./.github/workflows/builds-mv2.yml
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
    secrets: inherit

  builds-beta-flask:
    name: Builds beta/flask
    needs:
      - get-requirements
    if: >-
      ${{
        needs.get-requirements.outputs.skip-everything != 'true' &&
        needs.get-requirements.outputs.needs-beta-flask-builds == 'true'
      }}
    uses: ./.github/workflows/builds-beta-flask.yml
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
    secrets: inherit

  performance-benchmarks:
    name: Performance benchmark
    if: ${{ !cancelled() && needs.get-requirements.outputs.needs-benchmarks == 'true' && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/run-benchmarks.yml
    needs:
      - get-requirements
      - prep-deps
      - builds-mv3
      - builds-mv2
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
    secrets: inherit

  unit-and-integration-tests:
    name: Unit and integration tests
    needs:
      - get-requirements
      - prep-deps
    if: ${{ needs.get-requirements.outputs.needs-unit-and-integration == 'true' }}
    uses: ./.github/workflows/run-tests.yml

  code-coverage:
    name: Code coverage (SonarCloud)
    needs:
      - unit-and-integration-tests
    # Run SonarCloud on same-repo PRs and pushes to main on the canonical repo.
    if: >-
      ${{
        !cancelled() &&
        needs.unit-and-integration-tests.result == 'success' &&
        !github.event.repository.fork &&
        (
          (github.event_name == 'push' && github.ref_name == 'main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: lcov.info
          path: coverage

      - name: SonarCloud Scan
        # This is SonarSource/sonarqube-scan-action@v7.1.0
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bundle-size:
    name: Bundle size
    needs:
      - get-requirements
      - builds-mv3
    if: ${{ needs.get-requirements.outputs.skip-everything != 'true' && needs.get-requirements.outputs.builds-from-run == github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'default-branch' || null }}
    env:
      SELENIUM_BROWSER: chrome
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download artifact 'build-dist-webpack'
        uses: actions/download-artifact@v7
        with:
          name: build-dist-webpack
          github-token: ${{ secrets.GITHUB_TOKEN }} # This is required when downloading artifacts from a different repository or from a different workflow run.
          run-id: ${{ needs.get-requirements.outputs.builds-from-run }} # Download from the run that produced the builds.

      - name: Copy bundle size summary
        run: mkdir -p test-artifacts && mv dist/bundle-size test-artifacts/chrome

      - name: Get token
        id: token
        if: ${{ env.BRANCH == 'main' && !github.event.repository.fork }}
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/extension_bundlesize_stats
          permissions: |
            contents: write

      - name: Record bundle size at commit
        # Skip on fork repos — only record stats on the canonical repository.
        if: ${{ env.BRANCH == 'main' && !github.event.repository.fork }}
        env:
          EXTENSION_BUNDLESIZE_STATS_TOKEN: ${{ steps.token.outputs.token }}
        run: ./.github/scripts/bundle-stats-commit.sh

      - name: Upload 'bundle-size' to S3
        if: ${{ vars.AWS_REGION && vars.AWS_IAM_ROLE && vars.AWS_S3_BUCKET }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          # We use env.RUN_ID here, not builds-from-run.
          # This job would never actually run if `builds-from-run != github.run_id`,
          # but if it did anyway, we want to upload *this run's* analysis output, not the build run's output.
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ env.RUN_ID }}/bundle-size
          path: test-artifacts/chrome

  prep-e2e:
    needs:
      - get-requirements
      - prep-deps
    if: ${{ needs.get-requirements.outputs.needs-e2e == 'true' }}
    uses: ./.github/workflows/prep-e2e.yml

  e2e-chrome:
    needs:
      - get-requirements
      - prep-e2e
      - builds-mv3
    uses: ./.github/workflows/e2e-chrome.yml
    # Without this `if`, when builds-from-run is activated, the build jobs are considered skipped, and the downstream E2E tests won't run
    if: ${{ !cancelled() && needs.get-requirements.outputs.needs-e2e == 'true' && !contains(needs.*.result, 'failure') }}
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
      use-matrix: ${{ needs.prep-e2e.outputs.use-matrix }}
    secrets: inherit

  e2e-firefox:
    needs:
      - get-requirements
      - prep-e2e
      - builds-mv2
    uses: ./.github/workflows/e2e-firefox.yml
    # Without this `if`, when builds-from-run is activated, the build jobs are considered skipped, and the downstream E2E tests won't run
    if: ${{ !cancelled() && needs.get-requirements.outputs.needs-e2e == 'true' && !contains(needs.*.result, 'failure') }}
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
      use-matrix: ${{ needs.prep-e2e.outputs.use-matrix }}
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}

  build-ts-migration-dashboard:
    name: Build ts migration dashboard
    if: ${{ github.event_name != 'merge_group' && needs.get-requirements.outputs.skip-everything != 'true' && needs.get-requirements.outputs.builds-from-run == github.run_id }}
    needs:
      - get-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'default-branch' || null }}
    permissions:
      id-token: write
      contents: read
    env:
      # For a `pull_request` event, the branch is `github.head_ref`.
      # For a `push` event, the branch is `github.ref_name`.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: ${{ github.ref_name == 'main' || github.ref_name == 'stable' || startsWith(github.ref_name, 'release/') }}
          skip-allow-scripts: true

      - name: Build ts migration dashboard
        run: yarn ts-migration:dashboard:build

      - name: Upload 'ts-migration-dashboard' to S3
        if: ${{ vars.AWS_REGION && vars.AWS_IAM_ROLE && vars.AWS_S3_BUCKET }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/ts-migration-dashboard
          path: development/ts-migration-dashboard/build/final

      - name: Get token
        id: token
        if: ${{ env.BRANCH == 'main' }}
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/metamask-extension-ts-migration-dashboard
          permissions: |
            contents: write

      - name: Deploy ts migration dashboard
        if: ${{ env.BRANCH == 'main' }}
        env:
          TS_MIGRATION_DASHBOARD_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote add ts-migration-dashboard "https://x-access-token:${TS_MIGRATION_DASHBOARD_TOKEN}@github.com/MetaMask/metamask-extension-ts-migration-dashboard.git"
          git config user.name "MetaMask Bot"
          git config user.email metamaskbot@users.noreply.github.com
          yarn ts-migration:dashboard:deploy

  publish-prerelease:
    name: Publish prerelease
    # publish-prerelease when releases are enabled.
    #
    # This job is sequenced after *all* jobs in `needs`, including benchmarks.
    #
    # Requirements:
    # - For most jobs: result must be `success` or `skipped` (supports the builds-from-run shortcut).
    # - For benchmark jobs: result can be anything (failure does not block prerelease),
    if: >-
      ${{
        !cancelled() &&
        needs.get-requirements.outputs.needs-releases == 'true' &&
        contains(fromJson('["success","skipped"]'), needs.builds-mv3.result) &&
        contains(fromJson('["success","skipped"]'), needs.builds-mv2.result) &&
        contains(fromJson('["success","skipped"]'), needs.builds-beta-flask.result) &&
        contains(fromJson('["success","skipped"]'), needs.bundle-size.result) &&
        contains(fromJson('["success","skipped"]'), needs.storybook.result) &&
        contains(fromJson('["success","skipped"]'), needs.build-ts-migration-dashboard.result)
      }}
    needs:
      - get-requirements
      - builds-mv3
      - builds-mv2
      - builds-beta-flask
      - performance-benchmarks
      - bundle-size
      - storybook
      - build-ts-migration-dashboard
    uses: ./.github/workflows/publish-prerelease.yml
    with:
      builds-from-run: ${{ needs.get-requirements.outputs.builds-from-run }}
      builds-from-sha: ${{ needs.get-requirements.outputs.builds-from-sha }}
    secrets:
      E2E_OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY }}
      E2E_CLAUDE_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
      E2E_GEMINI_API_KEY: ${{ secrets.E2E_GEMINI_API_KEY }}

  trigger-regression-validation:
    name: Trigger Regression Validation
    # Guard: three conditions must all be true.
    #  1. Release branch — only release/* branches need regression validation.
    #  2. Not a fork repo — fork repos don't have the release-ci environment
    #     or its METAMASK_REGRESSION_TRIGGER_TEST secret.
    #  3. Not a cross-repo PR — GitHub withholds environment secrets from PRs
    #     whose head branch lives in a different repository, so the job would
    #     fail trying to read the dispatch token.
    # Build reuse is banned on release/* branches (in get-requirements.yml),
    # so builds-mv3 always runs here — no !cancelled() needed.
    if: >-
      ${{
        startsWith(github.head_ref || github.ref_name, 'release/')
        && !github.event.repository.fork
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    needs:
      - get-requirements
      - builds-mv3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-ci
    steps:
      - name: Get token
        id: token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/extension-regression-validation-poc
          permissions: |
            contents: write

      - name: Trigger regression validation in external repo
        env:
          DISPATCH_TOKEN: ${{ steps.token.outputs.token }}
          BUILDS_FROM_RUN: ${{ needs.get-requirements.outputs.builds-from-run }}
        run: |
          # Extract version from branch name (e.g., release/12.5.0 -> 12.5.0)
          # Use BRANCH env var which correctly handles both push and pull_request events
          VERSION="${BRANCH#release/}"

          echo "Triggering regression validation..."
          echo "Run ID (builds): $BUILDS_FROM_RUN"
          echo "Branch: $BRANCH"
          echo "Version: $VERSION"
          echo "Commit SHA: $HEAD_COMMIT_HASH"

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            https://api.github.com/repos/MetaMask/extension-regression-validation-poc/dispatches \
            -d '{
              "event_type": "release_pr_updated",
              "client_payload": {
                "run_id": "'"$BUILDS_FROM_RUN"'",
                "version": "'"$VERSION"'",
                "branch": "'"$BRANCH"'",
                "commit_sha": "'"$HEAD_COMMIT_HASH"'"
              }
            }'

          echo "Regression validation triggered successfully"

  ci-status-gate:
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: read
      statuses: write
      checks: read
    # We list every job we want to validate in `needs`, because `needs` only contains results for jobs explicitly
    # named here. A failing job can cause downstream jobs to be `skipped`, which can hide the true failure unless
    # the upstream job is also included.
    #
    # For instance, if prep-e2e fails, e2e-chrome and e2e-firefox are skipped, so we need the direct result of prep-e2e.
    #
    # Jobs intentionally excluded:
    # - Publish jobs (not required for CI pass)
    # - Jobs that depend on ci-status-gate (e.g., log-merge-group-failure) cannot be included here
    # - code-coverage / SonarCloud (informational; does not gate merge)
    #
    # Builds are grouped by consumer: MV3 (Chrome E2E), MV2 (Firefox E2E),
    # and beta/flask production variants (skipped on feature pull_requests).
    needs:
      - get-requirements
      - locales-changed-only
      - prep-deps
      - lint
      - repository-health-checks
      - storybook
      - lavamoat-validate-policies
      - builds-mv3
      - builds-mv2
      - builds-beta-flask
      - performance-benchmarks
      - unit-and-integration-tests
      - bundle-size
      - prep-e2e
      - e2e-chrome
      - e2e-firefox
      - build-ts-migration-dashboard
      - trigger-regression-validation
    uses: ./.github/workflows/ci-status-gate.yml
    with:
      needs-json: ${{ toJson(needs) }}
      skip-builds: ${{ needs.get-requirements.outputs.skip-builds }}
    secrets: inherit
