name: QA Stats

on:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  actions: read

jobs:
  collect-qa-stats:
    name: Collect QA Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Set optional run ID override
        if: ${{ vars.RUN_ID_TO_COLLECT != '' }}
        run: echo "RUN_ID_TO_COLLECT=${{ vars.RUN_ID_TO_COLLECT }}" >> "$GITHUB_ENV"

      - name: Collect QA stats
        run: yarn tsx .github/scripts/collect-qa-stats.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload QA stats artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-stats
          path: ./qa-stats.json
          if-no-files-found: error
