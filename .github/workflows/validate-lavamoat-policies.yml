name: Validate LavaMoat policies

on:
  workflow_call:

env:
  INFURA_PROJECT_ID: 00000000000
  INFURA_PROD_PROJECT_ID: 00000000000
  SEGMENT_PROD_WRITE_KEY: 00000000000

jobs:
  validate-lavamoat-policy-webpack-build:
    name: Validate LavaMoat webpack build policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Validate LavaMoat webpack build policy
        run: yarn webpack:tsc && yarn webpack:lavamoat:policy:build

      - name: Check working tree
        id: check-working-tree
        run: |
          if ! git diff --exit-code > lavamoat-policy-diff-webpack-build.patch; then
              cat lavamoat-policy-diff-webpack-build.patch
              echo "::error::Working tree dirty."
              exit 1
          fi

      - name: Upload policy diff on failure
        if: ${{ failure() && steps.check-working-tree.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lavamoat-policy-diff-webpack-build
          path: lavamoat-policy-diff-webpack-build.patch

  validate-lavamoat-policy-webpack-mv2:
    name: Validate LavaMoat webpack MV2 policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Validate LavaMoat webpack MV2 policy
        run: yarn webpack:tsc && yarn webpack:lavamoat:policy:mv2

      - name: Check working tree
        id: check-working-tree
        run: |
          if ! git diff --exit-code > lavamoat-policy-diff-webpack-mv2.patch; then
              cat lavamoat-policy-diff-webpack-mv2.patch
              echo "::error::Working tree dirty."
              exit 1
          fi

      - name: Upload policy diff on failure
        if: ${{ failure() && steps.check-working-tree.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lavamoat-policy-diff-webpack-mv2
          path: lavamoat-policy-diff-webpack-mv2.patch

  validate-lavamoat-policy-webpack-mv3:
    name: Validate LavaMoat webpack MV3 policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # v3.5.0
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Validate LavaMoat webpack MV3 policy
        run: yarn webpack:tsc && yarn webpack:lavamoat:policy:mv3

      - name: Check working tree
        id: check-working-tree
        run: |
          if ! git diff --exit-code > lavamoat-policy-diff-webpack-mv3.patch; then
              cat lavamoat-policy-diff-webpack-mv3.patch
              echo "::error::Working tree dirty."
              exit 1
          fi

      - name: Upload policy diff on failure
        if: ${{ failure() && steps.check-working-tree.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lavamoat-policy-diff-webpack-mv3
          path: lavamoat-policy-diff-webpack-mv3.patch
