name: claude-litellm-probe

on:
  push:
    branches:
      - trigger-ci-copilot-probe
  workflow_dispatch:

permissions:
  contents: read

env:
  LITELLM_BASE_URL: https://litellm.consensys.info
  MODEL: claude-sonnet-5-5

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code and bubblewrap
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          claude --version
          sudo apt-get install -y bubblewrap socat
          bwrap --version
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Control, the Bash tool inherits the credential
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          out=$(claude -p 'Run this exact shell command and print only its output: [ -n "$ANTHROPIC_AUTH_TOKEN" ] && echo VISIBLE || echo HIDDEN' --model "$MODEL" --allowedTools Bash)
          echo "$out"
          echo "$out" | grep -q VISIBLE

      - name: With subprocess env scrubbing, the Bash tool must not see it
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        run: |
          out=$(claude -p 'Run this exact shell command and print only its output: [ -n "$ANTHROPIC_AUTH_TOKEN" ] && echo VISIBLE || echo HIDDEN' --model "$MODEL" --allowedTools Bash)
          echo "$out"
          echo "$out" | grep -q HIDDEN

  pi:
    runs-on: ubuntu-latest
    steps:
      - name: Install Pi and the LiteLLM provider, both pinned
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          pi --version
          pi install npm:pi-provider-litellm@4.8.0
          # Skills and MCP from the proxy would add prompt text and tools.
          # `pi install` registered the package in settings.json, so merge.
          settings=~/.pi/agent/settings.json
          [ -f "$settings" ] || { mkdir -p ~/.pi/agent; echo '{}' > "$settings"; }
          jq '. + {litellm: {skills: {enabled: false}, mcp: {enabled: false}, budget: {enabled: false}}}' "$settings" > "$settings.new"
          mv "$settings.new" "$settings"
          jq 'keys' "$settings"

      - name: Model count and one prompt through Pi
        env:
          LITELLM_API_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          PI_SKIP_VERSION_CHECK: '1'
        run: |
          echo "models listed: $(pi --list-models | wc -l)"
          pi -p "Reply with exactly the word OK and nothing else." --model "litellm/$MODEL"

      - name: Control, the bash tool inherits the credential
        env:
          LITELLM_API_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          PI_SKIP_VERSION_CHECK: '1'
        run: |
          out=$(pi -p 'Run this exact shell command and print only its output: [ -n "$LITELLM_API_KEY" ] && echo VISIBLE || echo HIDDEN' --model "litellm/$MODEL")
          echo "$out"
          echo "$out" | grep -q VISIBLE

  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Raw /v1/messages, compare requested model with what answered
        env:
          LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          # Internal backend names stay out of this public log; only booleans print.
          body=$(jq -n --arg m "$MODEL" '{model: $m, max_tokens: 16, messages: [{role: "user", content: "Reply with exactly OK"}]}')
          curl -sS -D headers.txt -o response.json \
            -H "Authorization: Bearer $LITELLM_KEY" \
            -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d "$body" "$LITELLM_BASE_URL/v1/messages"
          tr -d '\r' < headers.txt > headers.clean
          echo "status line: $(head -n1 headers.clean)"
          echo "x-litellm header names: $(awk -F: 'tolower($1) ~ /^x-litellm/ {print tolower($1)}' headers.clean | sort | tr '\n' ' ')"
          header() { awk -F': ' -v k="$1" 'tolower($1) == k {print $2; exit}' headers.clean; }
          fail=0

          reported=$(jq -r '.model // empty' response.json)
          if [ -z "$reported" ]; then echo "FAIL: response has no model field"; fail=1
          elif [[ "$reported" == "$MODEL"* ]]; then echo "ok: body model is $reported"
          else echo "FAIL: body model differs from the requested one (value hidden)"; fail=1; fi

          group=$(header x-litellm-model-group)
          if [ -z "$group" ]; then echo "note: no x-litellm-model-group header"
          elif [ "$group" = "$MODEL" ]; then echo "ok: model group equals requested"
          else echo "FAIL: model group differs from requested (value hidden)"; fail=1; fi

          backend=$(header x-litellm-model-name)
          if [ -z "$backend" ]; then echo "note: no x-litellm-model-name header"
          elif echo "$backend" | grep -qi sonnet; then echo "ok: backend model name mentions sonnet"
          else echo "FAIL: backend model name does not mention sonnet (value hidden)"; fail=1; fi

          fallbacks=$(header x-litellm-attempted-fallbacks)
          if [ -n "$fallbacks" ] && [ "$fallbacks" != "0" ]; then echo "FAIL: router used fallbacks ($fallbacks)"; fail=1
          else echo "ok: no fallbacks reported (header value: ${fallbacks:-absent})"; fi

          exit $fail

      - name: Claude Code, models it actually called
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          claude -p "Reply with exactly the word OK" --model "$MODEL" --output-format json > claude.json
          echo "result: $(jq -r '.result' claude.json)"
          keys=$(jq -r '(.modelUsage // {}) | keys[]' claude.json)
          echo "modelUsage keys: $(echo "$keys" | wc -l)"
          extra=$(echo "$keys" | grep -vc "^$MODEL" || true)
          echo "models other than the requested one: $extra"
          [ -n "$keys" ] && [ "$extra" = "0" ]

  sandbox-yarn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Warm the Corepack cache outside the sandbox
        run: |
          corepack enable
          yarn --version

      - name: Control, update-lockfile without any sandbox
        run: |
          code=0
          yarn install --mode=update-lockfile > control.log 2>&1 || code=$?
          echo "control exit=$code"
          tail -n 6 control.log | cut -c1-200
          git checkout -q -- package.json yarn.lock
          git status --short

      - name: Install bubblewrap, socat and a narrow AppArmor profile
        run: |
          sudo apt-get install -y bubblewrap socat
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo systemctl reload apparmor
          which bwrap

      - name: Install pinned Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          claude --version

      - name: Run the battery inside the Claude Code sandbox
        env:
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '3600000'
        run: |
          mkdir -p ~/.cache ~/.yarn ~/.npm ~/.config
          settings=$(jq -nc '{sandbox: {enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, filesystem: {allowWrite: ["~/.cache", "~/.yarn", "~/.npm", "~/.config"]}, network: {allowedDomains: ["registry.npmjs.org", "registry.yarnpkg.com", "repo.yarnpkg.com", "github.com", "codeload.github.com"]}}}')
          claude -p 'Run exactly this shell command and reply with only the word DONE: bash .github/probe/sandbox-battery.sh' \
            --model "$MODEL" --settings "$settings" --permission-mode dontAsk \
            --allowedTools 'Bash(bash .github/probe/sandbox-battery.sh)' \
            --max-turns 6 --output-format json > claude-run.json

      - name: Assert on the results the script wrote
        if: always()
        run: |
          jq '{is_error, num_turns, total_cost_usd, denials: ((.permission_denials // []) | length)}' claude-run.json || true
          cat sandbox-results.txt
          echo '--- detail of failures'
          cat sandbox-detail.txt
          echo '--- host view of the write probe'
          ls -l ~/sandbox-probe || true
          [ "$(tail -n1 sandbox-results.txt)" = DONE ] && ! grep -q '^FAIL' sandbox-results.txt

