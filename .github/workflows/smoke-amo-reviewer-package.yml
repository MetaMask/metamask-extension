name: Smoke AMO reviewer packaging

# Package-only dry run of publish-firefox-reviewer-artifacts.sh (INFRA-3674 follow-on).
#
# Proves: mtree-netbsd install, firefox-bundle-script clone, prepare_release /
# compare_builds for production + Flask, and expected output filenames.
#
# Does NOT: assume an AWS role, upload to S3, create/edit GitHub Releases, push
# tags, or mutate firefox-bundle-script. Existing release assets are read-only.
#
# Security: do NOT upload package zips or output/ as Actions artifacts — the
# AMO source zip contains tagged bundle.sh with production build secrets.
#
# Triggered on pull_request so it can run from this PR without merging.
# No path filter: a new workflow file + paths filter can fail to schedule.
# Re-run from the Checks tab to repeat without a new commit. Close the PR
# without merging when done.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: smoke-amo-reviewer-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package AMO reviewer artifacts (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Fixed to a known-good released tag; change here if you need another version.
      RELEASE_TAG: v13.42.0
      FIREFOX_BUNDLE_SCRIPT_TOKEN: ${{ secrets.FIREFOX_BUNDLE_SCRIPT_TOKEN }}
    steps:
      - name: Validate release_tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like vX.Y.Z (got '${RELEASE_TAG}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Tags help resolve_last_listed_version; fallback is the input version.
          fetch-depth: 0

      - name: Package Firefox reviewer artifacts
        env:
          # runner.temp is step-scoped; script default is $RUNNER_TEMP/... if unset.
          AMO_REVIEWER_PACKAGE_ROOT: ${{ runner.temp }}/amo-reviewer-artifacts
        run: bash .github/scripts/publish-firefox-reviewer-artifacts.sh package

      - name: Verify package outputs (no artifact upload)
        env:
          AMO_REVIEWER_PACKAGE_ROOT: ${{ runner.temp }}/amo-reviewer-artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_dir="${AMO_REVIEWER_PACKAGE_ROOT}/${version}"
          required=(
            "metamask-firefox-${version}-source.zip"
            "metamask-firefox-${version}-amo-approval-notes.txt"
            "metamask-firefox-${version}-flask.0-source.zip"
            "metamask-firefox-${version}-flask.0-amo-approval-notes.txt"
          )

          {
            echo "## AMO reviewer packaging smoke"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|------|------|---------|"
          } >> "${GITHUB_STEP_SUMMARY}"

          for name in "${required[@]}"; do
            path="${package_dir}/${name}"
            if [[ ! -f "${path}" ]]; then
              echo "::error::Expected package file missing: ${path}"
              exit 1
            fi
            size="$(du -h "${path}" | cut -f1)"
            digest="$(sha256sum "${path}" | awk '{print $1}')"
            echo "${name}: ${size} sha256=${digest}"
            echo "| \`${name}\` | ${size} | \`${digest}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done

          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Package-only smoke passed for \`${RELEASE_TAG}\`. No S3 upload and no Actions artifact upload." >> "${GITHUB_STEP_SUMMARY}"
