name: 'CLA Signature Bot'
on:
  issue_comment:
    types: [created]
  # `pull_request` gives same-repo PRs a write token, which the bot needs to
  # comment, commit signatures and lock the PR on close. Fork PRs get a
  # read-only token here, so the job skips them; a fork contributor can still
  # sign by commenting, which runs through `issue_comment` with a write token.
  pull_request:
    types: [opened, closed, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(contains(github.ref, 'refs/heads/main') || contains(github.ref, 'refs/heads/stable')) }}

jobs:
  CLABot:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment' && contains(github.event.comment.html_url, '/pull/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: 'CLA Signature Bot'
        uses: MetaMask/cla-signature-bot@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'cla.json'
          url-to-cladocument: 'https://metamask.com/cla'
          # This branch can't have protections, commits are made directly to the specified branch.
          branch: 'cla-signatures'
          allowlist: '*[bot],metamaskbot,crowdin-bot,cursorbot,cursoragent,Copilot,claude'
          allow-organization-members: true
          blockchain-storage-flag: false
