name: Main performance detector

# TEMPORARY (1/3): prototype of the main-commit performance detector (Phase C of
# the runner-calibration plan). For one commit on main it finds the nearest
# first-parent ancestor with a build, skips identical builds, runs a batch of 5
# paired base/head jobs per browser, and runs a second independent batch when
# the first looks suspicious. Results are a job summary and an artifact; there
# is no Slack message and nothing blocks. Runs only on trigger-ci-pilot-b, which
# main.yml ignores. Remove this file, main-detector-measure.yml and the
# main-detector folder under test/e2e/benchmarks when the detector moves to main.
#
# The push trigger only registers the workflow so it can be dispatched; it checks
# the latest main commit.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit on main to check (default is the latest main commit)
        required: false
        type: string
      mode:
        description: auto, or aa to run the head against itself as a false-alarm canary
        required: false
        type: choice
        options:
          - auto
          - aa
        default: auto
      inject_head_ms:
        description: Dry run only, milliseconds of busy-wait added to the head build
        required: false
        type: string
      post_slack:
        description: Post a ping to Slack (workflow_run always does)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - trigger-ci-pilot-b
    paths:
      - .github/workflows/main-detector.yml

run-name: ${{ format('Main performance detector {0}{1}{2}', inputs.head_sha || github.event.workflow_run.head_sha || github.sha, inputs.mode == 'aa' && ' (aa)' || '', inputs.inject_head_ms && ' (inject)' || '') }}

# One run per commit. Runs for different commits are independent and none is
# cancelled: a later merge must not drop the check of an earlier one.
concurrency:
  group: main-detector-${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DETECTOR_HOST: https://diuv6g5fj9pvx.cloudfront.net/metamask-extension

jobs:
  plan:
    # Main runs that were cancelled never finished their builds; failed runs still upload them.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.quick.outputs.proceed || steps.plan.outputs.proceed }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # Needs no checkout, so an unchanged commit finishes before any setup.
      # Canary and aa runs skip it and take the full path below.
      - name: Quick exit when the build inputs are unchanged
        id: quick
        uses: actions/github-script@v9
        env:
          HEAD_INPUT: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          MODE: ${{ inputs.mode }}
        with:
          script: |
            if (process.env.MODE === 'aa') return;
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: process.env.HEAD_INPUT || 'main',
            });
            const head = commit.sha;
            const parent = commit.parents[0]?.sha;
            if (!parent || parseInt(head.slice(0, 8), 16) % 10 === 0) return;

            const hashOf = async (ref) => {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });
              const status = data.statuses.find((s) => s.context === 'build-source-hash');
              return status?.description ?? '';
            };
            const [headHash, parentHash] = await Promise.all([hashOf(head), hashOf(parent)]);
            if (!headHash || headHash !== parentHash) return;

            require('fs').writeFileSync(
              'skip.json',
              JSON.stringify({ headSha: head, label: 'no change (identical builds)' }),
            );
            await core.summary
              .addRaw(
                `## Main performance detector\n\nHead \`${head.slice(0, 10)}\` has the same build-source hash as its parent \`${parent.slice(0, 10)}\`: **no change**, no jobs run.\n`,
              )
              .write();
            core.setOutput('proceed', 'false');
            core.setOutput('done', 'true');

      - name: Checkout and setup environment
        if: ${{ steps.quick.outputs.done != 'true' }}
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Resolve the builds and compare them
        id: plan
        if: ${{ steps.quick.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_INPUT: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Commits only: trees and blobs are fetched on demand, since the deep fetch took about a minute.
          git fetch --no-tags --depth=150 --filter=tree:0 origin main
          head=$(git rev-parse "${HEAD_INPUT:-FETCH_HEAD}")
          summary() { printf '## Main performance detector\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }

          node node_modules/tsx/dist/cli.mjs test/e2e/benchmarks/main-detector/resolve-cli.ts \
            --head "$head" --out resolve.json > /dev/null
          status=$(jq -r .status resolve.json)
          if [[ "$status" != measure ]]; then
            summary "Head \`${head:0:10}\`: **could not measure** ($status). No build for the head, or none for any of its recent ancestors."
            printf '{"headSha":"%s","label":"could not measure (%s)"}\n' "$head" "$status" > skip.json
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(jq -r .base.sha resolve.json)
          # Compares each zip's file list (names, sizes, CRCs) from its central
          # directory with range requests, so identical builds exit without downloads.
          node node_modules/tsx/dist/cli.mjs test/e2e/benchmarks/main-detector/compare-builds-cli.ts \
            --resolve resolve.json --out compare.json > /dev/null
          identical=$(jq -r .identical compare.json)

          # Identical builds need no jobs; 1 in 10 of them run as a false-alarm canary.
          canary=false
          if [[ "$MODE" == aa ]]; then
            canary=true
          elif [[ "$identical" == true ]]; then
            if (( 16#${head:0:8} % 10 == 0 )); then
              canary=true
            else
              summary "Head \`${head:0:10}\` builds the same as base \`${base:0:10}\`: **no change**, no jobs run."
              printf '{"headSha":"%s","label":"no change (identical builds)"}\n' "$head" > skip.json
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          plan=$(jq -c --argjson canary "$canary" '{
            headSha: .head.sha,
            headSubject: .subjects[.head.sha],
            baseSha: (if $canary then .head.sha else .base.sha end),
            canary: $canary,
            rangeSize: (.range | length),
            headRun: .head.run,
            headVersion: .head.version,
            baseRun: (if $canary then .head.run else .base.run end),
            baseVersion: (if $canary then .head.version else .base.version end)
          }' resolve.json)
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

      - name: Upload the skip verdict
        if: ${{ always() && hashFiles('skip.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: detector-skip
          path: skip.json
          retention-days: 30

  measure-first:
    needs: plan
    if: ${{ needs.plan.outputs.proceed == 'true' }}
    uses: ./.github/workflows/main-detector-measure.yml
    secrets: inherit
    with:
      plan: ${{ needs.plan.outputs.plan }}
      batch: 1
      inject_head_ms: ${{ inputs.inject_head_ms }}

  score-first:
    needs: [plan, measure-first]
    if: ${{ always() && needs.plan.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      needs_confirm: ${{ steps.score.outputs.needs_confirm }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download batch 1
        uses: actions/download-artifact@v8
        with:
          pattern: detector-b1-*
          path: artifacts

      - name: Score batch 1
        id: score
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          echo "$PLAN" > plan.json
          yarn tsx test/e2e/benchmarks/main-detector/score-cli.ts --stage first \
            --dir artifacts --plan plan.json --out first.json \
            --github-output "$GITHUB_OUTPUT"

  measure-confirm:
    needs: [plan, score-first]
    if: ${{ needs.score-first.outputs.needs_confirm == 'true' }}
    uses: ./.github/workflows/main-detector-measure.yml
    secrets: inherit
    with:
      plan: ${{ needs.plan.outputs.plan }}
      batch: 2
      inject_head_ms: ${{ inputs.inject_head_ms }}

  report:
    needs: [plan, score-first, measure-confirm]
    if: ${{ always() && needs.plan.outputs.proceed == 'true' && needs.score-first.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download the batches
        uses: actions/download-artifact@v8
        with:
          pattern: detector-b*
          path: artifacts

      - name: Score and report
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          echo "$PLAN" > plan.json
          yarn tsx test/e2e/benchmarks/main-detector/score-cli.ts --stage final \
            --dir artifacts --plan plan.json --out result.json \
            --summary "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Upload the result
        uses: actions/upload-artifact@v7
        with:
          name: detector-result
          path: result.json
          retention-days: 30

      - name: Post to Slack
        if: ${{ github.event_name == 'workflow_run' || inputs.post_slack }}
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_MAIN_DETECTOR: ${{ secrets.SLACK_WEBHOOK_MAIN_DETECTOR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          yarn tsx test/e2e/benchmarks/main-detector/slack-cli.ts \
            --result result.json --run-url "$RUN_URL"
