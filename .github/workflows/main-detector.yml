name: Main performance detector

# Posts to Slack when one commit on main changes startup performance by more
# than the noise. For each push to main it compares the commit's build with
# its first-parent ancestor's in paired jobs on one runner, and confirms a
# suspicious result with a second batch. The critical user flows of the same
# commit run beside it in Chrome and are scored with ADR 0072's paired decision
# rule. Identical builds exit early. It is not a merge gate.
#
# Beside the commit checks, scheduled runs slow Chrome's CPU and measure with
# the same paired jobs and scoring, each under its own Slack label: daily, the
# newest main commit against the commit the last daily run measured, in the
# standard and the power-user startup preset and the critical user flows;
# weekly, the newest main commit against a pinned reference build, to catch
# creep spread over many commits; and weekly, a check of the floors against the
# week's A/A canary results, which measures nothing. See
# .github/scripts/main-detector/README.md.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]
  schedule:
    # Daily at 07:00 UTC, after the scheduled Main runs, which start hourly from
    # 02:00 to 06:00 UTC: the throttled daily run.
    - cron: '0 7 * * *'
    # Mondays at 08:00 UTC: the drift check against the pinned reference build.
    - cron: '0 8 * * 1'
    # Mondays at 09:00 UTC: the check of the floors against the week's canaries.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit on main to check (default is the latest main commit)
        required: false
        type: string
      mode:
        description: auto; aa to run the head against itself as a false positive rate canary; throttled, throttled-aa (the same against itself) or drift to run a scheduled throttled run now; calibration to check the floors against the week's canaries
        required: false
        type: choice
        options:
          - auto
          - aa
          - throttled
          - throttled-aa
          - drift
          - calibration
        default: auto
      cpu_throttle_rate:
        description: Throttled modes only, how many times slower Chrome runs page CPU work
        required: false
        type: string
        default: '2'
      iterations:
        description: Throttled modes only, browser sessions per startup job and iterations per critical user flow job, a multiple of 10 (the commit checks use 10)
        required: false
        type: string
        default: '20'
      base_sha:
        description: Throttled mode only, the commit to compare with (default is the commit the last daily run measured, or the pinned reference for drift)
        required: false
        type: string
      inject_head_ms:
        description: Dry run only, milliseconds of busy-wait added to the head build
        required: false
        type: string
      post_slack:
        description: Post a ping to Slack (workflow_run always does)
        required: false
        type: boolean
        default: false

run-name: ${{ format('Main performance detector {0}{1}{2}', (github.event_name == 'schedule' || contains(fromJSON('["throttled","throttled-aa","drift","calibration"]'), inputs.mode)) && 'latest-main' || inputs.head_sha || github.event.workflow_run.head_sha || 'latest-main', github.event_name == 'schedule' && format(' ({0})', github.event.schedule == '0 8 * * 1' && 'drift' || github.event.schedule == '0 9 * * 1' && 'calibration' || 'throttled') || inputs.mode == 'throttled' && ' (throttled)' || inputs.mode == 'throttled-aa' && ' (throttled aa)' || inputs.mode == 'drift' && ' (drift)' || inputs.mode == 'calibration' && ' (calibration)' || inputs.mode == 'aa' && ' (aa)' || '', inputs.inject_head_ms && ' (inject)' || '') }}

# One run per commit. Runs for different commits are independent and none is
# cancelled: a later merge must not drop the check of an earlier one. A dispatch
# with no head_sha measures the tip of main, which a title cannot name, so it
# is called latest-main and no commit's heartbeat or re-run check counts it. The
# scheduled runs are one group each, by what triggered them.
concurrency:
  group: main-detector-${{ (github.event_name == 'schedule' || contains(fromJSON('["throttled","throttled-aa","drift","calibration"]'), inputs.mode)) && (inputs.mode || github.event.schedule) || inputs.head_sha || github.event.workflow_run.head_sha || 'latest-main' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: read

env:
  # Must equal the number of shards in main-detector-measure.yml.
  DETECTOR_SHARDS: 5
  # Must equal the number of shards of the cufs job below.
  DETECTOR_CUF_SHARDS: 2

jobs:
  plan:
    # Main runs that were cancelled never finished their builds; failed runs still upload them.
    if: ${{ github.event_name != 'schedule' && !contains(fromJSON('["throttled","throttled-aa","drift","calibration"]'), inputs.mode) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled')) }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.quick.outputs.proceed || steps.plan.outputs.proceed }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # Needs no checkout, so an unchanged commit finishes before any setup.
      # Canary and aa runs skip it and take the full path below.
      - name: Quick exit when the build inputs are unchanged
        id: quick
        uses: actions/github-script@v9
        env:
          HEAD_INPUT: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          MODE: ${{ inputs.mode }}
          INJECT: ${{ inputs.inject_head_ms }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const input = process.env.HEAD_INPUT;
            if (input && !/^[0-9a-f]{40}$/u.test(input)) {
              core.setFailed('head_sha must be a full 40-character commit SHA');
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: input || 'main',
            });
            const head = commit.sha;
            const parent = commit.parents[0]?.sha;
            // The plan step reads this, so both steps judge the same commit.
            core.setOutput('head', head);

            const finish = async (label, message) => {
              require('fs').writeFileSync('skip.json', JSON.stringify({ headSha: head, label }));
              await core.summary.addRaw(`## Main performance detector\n\n${message}\n`).write();
              core.setOutput('proceed', 'false');
              core.setOutput('done', 'true');
            };

            if (process.env.MODE === 'aa' || process.env.INJECT) return;

            // Re-running Main fires this workflow again; do not measure a commit twice.
            if (Number(context.payload.workflow_run?.run_attempt) > 1) {
              const since = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'main-detector.yml',
                created: `>=${since}`,
                per_page: 100,
              });
              // A run that could not measure leaves detector-unmeasured, not a verdict.
              let checked = false;
              const earlier = runs.filter(
                (run) =>
                  run.id !== context.runId &&
                  run.event === 'workflow_run' &&
                  run.display_title.includes(head),
              );
              for (const run of earlier) {
                if (run.conclusion === null) {
                  checked = true;
                  break;
                }
                if (run.conclusion !== 'success') continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                if (artifacts.some((a) => a.name === 'detector-result' || a.name === 'detector-skip')) {
                  checked = true;
                  break;
                }
              }
              if (checked) {
                await finish(
                  'already checked (Main re-run)',
                  `Head \`${head.slice(0, 10)}\` was already checked by an earlier detector run; this Main re-run is ignored.`,
                );
                return;
              }
            }

            // Canary rule: keep in step with the shell check in the plan step below.
            if (!parent || parseInt(head.slice(0, 8), 16) % 10 === 0) return;

            const hashOf = async (ref) => {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });
              return statuses.find((s) => s.context === 'build-source-hash')?.description ?? '';
            };
            const [headHash, parentHash] = await Promise.all([hashOf(head), hashOf(parent)]);
            if (!headHash || headHash !== parentHash) return;

            // A parent whose Main run did not succeed may have no build, and then the
            // real base is an older commit, so only the full path can judge the head.
            const { data: parentRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'main.yml',
              head_sha: parent,
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            if (parentRuns.total_count === 0) return;

            await finish(
              'no change (identical builds)',
              `Head \`${head.slice(0, 10)}\` has the same build-source hash as its parent \`${parent.slice(0, 10)}\`: **no change**, no jobs run.`,
            );

      - name: Checkout the scripts
        if: ${{ steps.quick.outputs.done != 'true' }}
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        if: ${{ steps.quick.outputs.done != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Resolve the builds and compare them
        id: plan
        if: ${{ steps.quick.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.quick.outputs.head }}
          MODE: ${{ inputs.mode }}
          INJECT: ${{ inputs.inject_head_ms }}
          MAIN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # Commits only: trees and blobs are fetched on demand, since the deep fetch took about a minute.
          git fetch --no-tags --depth=150 --filter=tree:0 origin "$HEAD_SHA"
          head=$(git rev-parse "$HEAD_SHA")
          summary() { printf '## Main performance detector\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [[ -n "$INJECT" && ! "$INJECT" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::inject_head_ms must be a non-negative number"
            exit 1
          fi

          node .github/scripts/main-detector/resolve-cli.mts \
            --head "$head" --out resolve.json > /dev/null
          status=$(jq -r .status resolve.json)
          # An A/A canary never uses the base, so a missing one does not matter.
          if [[ "$status" != measure && ! ( "$MODE" == aa && "$status" == no-base ) ]]; then
            summary "Head \`${head:0:10}\`: **could not measure** ($status). No build for the head, or none for any of its recent ancestors."
            printf '{"headSha":"%s","label":"could not measure (%s)"}\n' "$head" "$status" > unmeasured.json
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            # A successful Main run always leaves a build, so a missing one
            # means the lookup is broken; fail so the heartbeat reports it.
            if [[ "$status" == no-base || "$MAIN_CONCLUSION" == success ]]; then
              exit 1
            fi
            exit 0
          fi

          base=$(jq -r '.base.sha // empty' resolve.json)
          identical=false
          if [[ "$MODE" != aa ]]; then
            # Compares each zip's file list (names, sizes, CRCs) from its central
            # directory with range requests, so identical builds exit without downloads.
            node .github/scripts/main-detector/compare-builds-cli.mts \
              --resolve resolve.json --out compare.json > /dev/null
            identical=$(jq -r .identical compare.json)
          fi

          # Identical builds need no jobs; 1 in 10 of them run as a false-alarm canary.
          # An injection run must measure, since it slows the head on purpose.
          canary=false
          if [[ "$MODE" == aa ]]; then
            canary=true
          elif [[ "$identical" == true && -z "$INJECT" ]]; then
            if (( 16#${head:0:8} % 10 == 0 )); then
              canary=true
            else
              summary "Head \`${head:0:10}\` builds the same as base \`${base:0:10}\`: **no change**, no jobs run."
              printf '{"headSha":"%s","label":"no change (identical builds)"}\n' "$head" > skip.json
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          plan=$(jq -c --argjson canary "$canary" --arg inject "$INJECT" '{
            headSha: .head.sha,
            headSubject: .subjects[.head.sha],
            baseSha: (if $canary then .head.sha else .base.sha end),
            canary: $canary,
            injectMs: (if $inject == "" then null else ($inject | tonumber) end),
            rangeSize: (if $canary then 1 else (.range | length) end),
            headRun: .head.run,
            headVersion: .head.version,
            baseRun: (if $canary then .head.run else .base.run end),
            baseVersion: (if $canary then .head.version else .base.version end)
          }' resolve.json)
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

      - name: Upload the skip verdict
        if: ${{ always() && hashFiles('skip.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: detector-skip
          path: skip.json
          overwrite: true
          retention-days: 30

      # Kept apart from detector-skip so a Main re-run can tell "decided" from "could not decide".
      - name: Upload the could-not-measure verdict
        if: ${{ always() && hashFiles('unmeasured.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: detector-unmeasured
          path: unmeasured.json
          overwrite: true
          retention-days: 30

  # origin: ai-synthesis
  # Plans the scheduled runs that slow Chrome's CPU: the daily run, which
  # compares the newest main commit with a build against the one the last daily
  # run measured, and the weekly drift check against the pinned reference build.
  scheduled:
    if: ${{ (github.event_name == 'schedule' || contains(fromJSON('["throttled","throttled-aa","drift"]'), inputs.mode)) && github.event.schedule != '0 9 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      proceed: ${{ steps.plan.outputs.proceed }}
      plan: ${{ steps.plan.outputs.plan }}
      power_user_plan: ${{ steps.plan.outputs.power_user_plan }}
      iterations: ${{ steps.plan.outputs.iterations }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Commits only: trees and blobs are fetched on demand. The drift check
      # needs every commit since its reference build, a few hundred.
      - name: Fetch the history of main
        run: git fetch --no-tags --depth=1500 --filter=tree:0 origin +main:refs/remotes/origin/main

      - name: Choose the head and the base
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          RATE: ${{ inputs.cpu_throttle_rate || '2' }}
          ITERATIONS: ${{ inputs.iterations || '20' }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          kind=daily
          if [[ "$SCHEDULE" == '0 8 * * 1' || "$MODE" == drift ]]; then
            kind=drift
          fi
          args=(--kind "$kind" --rate "$RATE" --iterations "$ITERATIONS" --github-output "$GITHUB_OUTPUT")
          if [[ "$MODE" == throttled-aa ]]; then
            args+=(--canary)
          fi
          if [[ -n "$HEAD_SHA" ]]; then
            args+=(--head "$HEAD_SHA")
          fi
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          node .github/scripts/main-detector/scheduled-plan-cli.mts "${args[@]}" | tee message.txt
          printf '## Main performance detector (%s)\n\n%s\n' "$kind" "$(cat message.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the record of a skipped daily run
        if: ${{ steps.plan.outputs.skip_record != '' }}
        env:
          SKIPPED: ${{ steps.plan.outputs.skip_record }}
        run: printf '{"headSha":"%s","label":"no change (identical builds)"}\n' "$SKIPPED" > measured.json

      - name: Record the commit a daily run skipped
        if: ${{ steps.plan.outputs.skip_record != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: throttled-measured-${{ steps.plan.outputs.skip_record }}
          path: measured.json
          overwrite: true
          retention-days: 30

  daily:
    needs: scheduled
    if: ${{ needs.scheduled.outputs.proceed == 'true' && needs.scheduled.outputs.kind == 'daily' }}
    uses: ./.github/workflows/main-detector-batch.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      plan: ${{ needs.scheduled.outputs.plan }}
      iterations: ${{ needs.scheduled.outputs.iterations }}
      include_cufs: true
      post_slack: ${{ inputs.post_slack == true }}

  # The power-user startup preset, measured in the daily run on the same range.
  power-user:
    needs: scheduled
    if: ${{ needs.scheduled.outputs.proceed == 'true' && needs.scheduled.outputs.kind == 'daily' }}
    uses: ./.github/workflows/main-detector-batch.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      plan: ${{ needs.scheduled.outputs.power_user_plan }}
      # Its jobs take about 15 minutes at full speed with 10 sessions, so 20 sessions at 2 times slower would not fit a job's timeout.
      iterations: '10'
      include_cufs: false
      post_slack: ${{ inputs.post_slack == true }}

  drift:
    needs: scheduled
    if: ${{ needs.scheduled.outputs.proceed == 'true' && needs.scheduled.outputs.kind == 'drift' }}
    uses: ./.github/workflows/main-detector-batch.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      plan: ${{ needs.scheduled.outputs.plan }}
      iterations: ${{ needs.scheduled.outputs.iterations }}
      include_cufs: true
      post_slack: ${{ inputs.post_slack == true }}

  # The daily run's other presets, on the head build alone and unscored.
  presets:
    needs: scheduled
    if: ${{ needs.scheduled.outputs.proceed == 'true' && needs.scheduled.outputs.kind == 'daily' && inputs.mode != 'throttled-aa' }}
    uses: ./.github/workflows/main-detector-throttled.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
    with:
      plan: ${{ needs.scheduled.outputs.plan }}

  # Records the commit the daily run measured, once every pass of it succeeded.
  # The next daily run reads the commit from the name of this artifact.
  record:
    needs: [scheduled, daily, power-user]
    if: ${{ needs.daily.result == 'success' && needs.power-user.result == 'success' && inputs.mode != 'throttled-aa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the record
        env:
          PLAN: ${{ needs.scheduled.outputs.plan }}
        run: |
          set -euo pipefail
          echo "$PLAN" | jq -c '{headSha, baseSha, rangeSize}' > measured.json
          echo "HEAD_SHA=$(jq -r .headSha measured.json)" >> "$GITHUB_ENV"

      - name: Record the commit the daily run measured
        uses: actions/upload-artifact@v7
        with:
          name: throttled-measured-${{ env.HEAD_SHA }}
          path: measured.json
          overwrite: true
          retention-days: 30

  # Reads the week's A/A canary results and measures nothing.
  calibration:
    if: ${{ github.event.schedule == '0 9 * * 1' || inputs.mode == 'calibration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check the floors against the week's canaries
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_MAIN_DETECTOR_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POST: ${{ inputs.post_slack == true && '--post' || '' }}
        run: |
          node .github/scripts/main-detector/calibration-cli.mts \
            --out calibration.json --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$RUN_URL" ${POST:+"$POST"}

      - name: Upload the calibration
        uses: actions/upload-artifact@v7
        with:
          name: calibration
          path: calibration.json
          retention-days: 30

  measure-first:
    needs: plan
    if: ${{ needs.plan.outputs.proceed == 'true' }}
    uses: ./.github/workflows/main-detector-measure.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
    with:
      plan: ${{ needs.plan.outputs.plan }}
      batch: 1
      inject_head_ms: ${{ inputs.inject_head_ms }}

  # origin: ai-synthesis
  # The critical user flows (CUFs) with an admitted series, on the plan's base
  # and head builds, so they share the startup check's trigger, skip and canary.
  # Each job alternates the two builds per iteration on one runner; the report
  # job pairs consecutive iterations and scores them with the paired rule.
  cufs:
    name: cuf-${{ matrix.flow }}-s${{ matrix.shard }}
    needs: plan
    if: ${{ needs.plan.outputs.proceed == 'true' }}
    # A failed job leaves its series unmeasured, which fails the report job.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # CUF_FLOW_FILES in .github/scripts/main-detector/cufs.mts; cufs.test.mts checks they match.
        flow:
          - bridgeUserActions
          - loadNewAccount
          - assetDetails
          - solanaAssetDetails
        # DETECTOR_CUF_SHARDS must equal the number of shards.
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SELENIUM_BROWSER: chrome
      SELENIUM_HEADLESS: true
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      BENCHMARK_RUNNER_LABEL: ubuntu-latest
      # Pair mode: the harness alternates the base (A) and head (B) build per iteration.
      BENCHMARK_AB_PILOT: '1'
      BENCHMARK_AB_SEQUENCE: ABBABAABAB
      # Same default as BUILD_HOST in .github/scripts/main-detector/build-source.mts.
      DETECTOR_BUILD_HOST: https://diuv6g5fj9pvx.cloudfront.net/metamask-extension
      # The scripts import typeless .ts files; keep Node's warning out of the log.
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Install anvil with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Download the base and head builds
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          for side in base head; do
            run=$(jq -r --arg k "${side}Run" '.[$k]' <<< "$PLAN")
            version=$(jq -r --arg k "${side}Version" '.[$k]' <<< "$PLAN")
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --output "$side.zip" \
              "$DETECTOR_BUILD_HOST/$run/build-test-webpack/builds/metamask-chrome-$version.zip"
            mkdir -p "pair/$side"
            unzip -q "$side.zip" -d "pair/$side"
          done
          mkdir -p test-artifacts/benchmarks

      - name: Prepare the A and B builds
        env:
          INJECT_HEAD_MS: ${{ inputs.inject_head_ms }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$INJECT_HEAD_MS" ]]; then
            args+=(--inject-head-ms "$INJECT_HEAD_MS")
          fi
          node test/e2e/benchmarks/prepare-ab-builds.mts \
            --browser chrome \
            --base-source pair/base --head-source pair/head \
            --out "test-artifacts/benchmarks/ab-builds-${{ matrix.flow }}-s${{ matrix.shard }}.json" \
            "${args[@]}"

      - name: Choose which build goes first
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "BENCHMARK_AB_FLIP=$(( SHARD % 2 ))" >> "$GITHUB_ENV"

      - name: Run the A/B benchmark
        timeout-minutes: 35
        env:
          FLOW: ${{ matrix.flow }}
          RESULT: test-artifacts/benchmarks/benchmark-chrome-webpack-${{ matrix.flow }}-s${{ matrix.shard }}.json
        run: |
          set -euo pipefail
          file=$(node --input-type=module -e "
            import { CUF_FLOW_FILES } from './.github/scripts/main-detector/cufs.mts';
            console.log(CUF_FLOW_FILES[process.argv[1]] ?? '');
          " "$FLOW")
          if [[ -z "$file" ]]; then
            echo "::error::No file for flow $FLOW in CUF_FLOW_FILES"
            exit 1
          fi
          yarn test:e2e:benchmark "$file" --iterations 10 --retries 2 --out "$RESULT"

      - name: Upload the result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: detector-cuf-${{ matrix.flow }}-s${{ matrix.shard }}
          path: test-artifacts/benchmarks/*.json
          # A re-run of failed jobs uploads the same names again.
          overwrite: true
          retention-days: 7
          if-no-files-found: ignore

  score-first:
    needs: [plan, measure-first]
    if: ${{ !cancelled() && needs.plan.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      needs_confirm: ${{ steps.score.outputs.needs_confirm }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download batch 1
        uses: actions/download-artifact@v8
        with:
          pattern: detector-b1-*
          path: artifacts

      - name: Score batch 1
        id: score
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          echo "$PLAN" > plan.json
          node .github/scripts/main-detector/score-cli.mts --stage first \
            --dir artifacts --plan plan.json --out first.json --shards "$DETECTOR_SHARDS" \
            --github-output "$GITHUB_OUTPUT"

  measure-confirm:
    needs: [plan, score-first]
    if: ${{ needs.score-first.outputs.needs_confirm == 'true' }}
    uses: ./.github/workflows/main-detector-measure.yml
    secrets:
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
    with:
      plan: ${{ needs.plan.outputs.plan }}
      batch: 2
      inject_head_ms: ${{ inputs.inject_head_ms }}

  report:
    needs: [plan, score-first, measure-confirm, cufs]
    if: ${{ !cancelled() && needs.plan.outputs.proceed == 'true' && needs.score-first.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # The CUF scoring imports typeless .ts files; keep Node's warning out of the log.
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v6
        with:
          # The two benchmark files are the admitted series and the paired rule, which import nothing.
          sparse-checkout: |
            .github
            .nvmrc
            test/e2e/benchmarks/utils/admitted-series.ts
            test/e2e/benchmarks/utils/paired-decision.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download the batches
        uses: actions/download-artifact@v8
        with:
          pattern: detector-b*
          path: artifacts

      - name: Download the critical user flows
        uses: actions/download-artifact@v8
        with:
          pattern: detector-cuf-*
          path: artifacts

      - name: Score and report
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          echo "$PLAN" > plan.json
          node .github/scripts/main-detector/score-cli.mts --stage final \
            --dir artifacts --plan plan.json --out result.json --shards "$DETECTOR_SHARDS" \
            --cuf-shards "$DETECTOR_CUF_SHARDS" \
            --summary "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Upload the result
        uses: actions/upload-artifact@v7
        with:
          name: detector-result
          path: result.json
          overwrite: true
          retention-days: 30

      - name: Post to Slack
        if: ${{ github.event_name == 'workflow_run' || inputs.post_slack }}
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_MAIN_DETECTOR_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/main-detector/slack-cli.mts \
            --result result.json --run-url "$RUN_URL"

      # A result that measured nothing is green on its own, so fail the run for the heartbeat to see.
      - name: Fail when a batch or a critical user flow could not be measured
        run: |
          status=0
          if jq -e '.decision.unmeasured | length > 0' result.json > /dev/null; then
            echo "::error::Could not measure: $(jq -r '.decision.unmeasured | join(", ")' result.json)"
            status=1
          fi
          if jq -e '(.cufs.unmeasured // []) | length > 0' result.json > /dev/null; then
            echo "::error::Could not measure critical user flows: $(jq -r '.cufs.unmeasured | join(", ")' result.json)"
            status=1
          fi
          exit "$status"
