name: copilot-billing-probe

on:
  push:
    branches:
      - trigger-ci-copilot-probe
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Run one Copilot CLI prompt with GITHUB_TOKEN only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Reply with exactly the word OK and nothing else." -s --no-ask-user
