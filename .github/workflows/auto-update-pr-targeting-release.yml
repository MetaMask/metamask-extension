name: Auto-update for PR targeting release branch

on:
  pull_request:
    branches:
      - release/*

jobs:
  auto-update:
    name: Auto-update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      YARN_ENABLE_HARDENED_MODE: false
      INFURA_PROJECT_ID: 00000000000
    permissions:
      id-token: write
    steps:
      - name: Get token
        id: token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write

      # We don't want to use action-checkout-and-setup here because it forces `yarn --immutable`
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}

      # Prevent loops on this action by checking if the last commit author is the bot itself
      - name: Prevent loops
        id: prevent-loops
        run: |
          author_name=$(git log -1 --pretty=format:'%an')
          if [ "$author_name" = "metamask-ci[bot]" ]; then
            echo "The author of the most recent commit is metamask-ci. Exiting the workflow."
            echo "stop_loop=true" >> "$GITHUB_OUTPUT"
          else
            echo "The author of the most recent commit is *not* metamask-ci, continuing..."
            echo "stop_loop=false" >> "$GITHUB_OUTPUT"
          fi

      - run: corepack enable
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}

      - name: Set up Node.js
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn dedupe
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}

      - name: Update all LavaMoat policies
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}
        run: yarn lavamoat:auto

      - name: Update attributions
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}
        run: yarn attributions:generate
        env:
          FORCE_CLEANUP: true # We want it to restore the allow-scripts plugin and development dependencies

      - name: Commit if there are changes
        if: ${{ steps.prevent-loops.outputs.stop_loop != 'true' }}
        run: |
          if git diff --exit-code
          then
            echo "No changes detected"
          else
            echo "Changes detected, committing..."
            git config --global user.name 'metamask-ci[bot]'
            git config --global user.email '271559518+metamask-ci[bot]@users.noreply.github.com'
            git commit -am "release: dedupe, update LavaMoat policies, update attributions"
            git push
          fi
