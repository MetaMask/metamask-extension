name: AI PR risk analysis

# Reusable workflow — called from main.yml after the shared changed-files artifact exists.
# Do not add a standalone pull_request trigger; that would double-run analysis.
#
# The action owns labels / check runs / summaries.
#
# Temporary: checkout + local `uses` until public-repo direct invoke
# (`uses: MetaMask/ai-analyzer@<sha>`) works for this repo. Then drop the
# checkout step, AI_ANALYZER_TOKEN, and switch to direct `uses`.
#
# Pin bump process for MetaMask/ai-analyzer:
# 1. Pick an immutable commit SHA from main
#    (https://github.com/MetaMask/ai-analyzer/commits/main) or from a release
#    (https://github.com/MetaMask/ai-analyzer/releases)
# 2. Update the checkout `ref:` (and later `uses: MetaMask/ai-analyzer@<sha>`)
# 3. Smoke-test Analyze on a PR

on:
  workflow_call:
    secrets:
      AI_ANALYZER_TOKEN:
        description: Token with read access to MetaMask/ai-analyzer (private action checkout)
        required: true
      AI_ANALYZER_LITELLM_KEY:
        description: LiteLLM API key for AI PR analysis
        required: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download changed-files artifact
        uses: actions/download-artifact@v7
        with:
          name: changed-files
          path: changed-files

      - name: Verify changed-files artifact
        run: |
          if [[ ! -f changed-files/changed-files.json ]]; then
            echo "::error::changed-files/changed-files.json is missing; refusing to fall back to gh rediscovery"
            exit 1
          fi

      # Pinned immutable SHA — see header pin bump process
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: b89c011b1515c193e0c3514393c38ad7066e21c4
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          config-path: .github/ai-pr-analyzer
          changed-files-path: changed-files/changed-files.json
          add-comment: false
          add-label: true
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'
