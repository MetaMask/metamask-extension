name: Prep E2E

on:
  workflow_call:
    outputs:
      use-matrix:
        description: The matrix for the E2E jobs
        value: ${{ jobs.prep-e2e.outputs.use-matrix }}

jobs:
  prep-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      use-matrix: ${{ steps.set-use-matrix.outputs.use-matrix }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Get changed files with git diff
        # On branch `stable`, there's no reason to do a diff
        if: ${{ (github.head_ref || github.ref_name) != 'stable' }}
        run: yarn tsx .github/scripts/git-diff-default-branch.mts

      - name: Upload changed files artifact
        # On branch `stable`, there's no reason to do a diff
        if: ${{ (github.head_ref || github.ref_name) != 'stable' }}
        uses: actions/upload-artifact@v6
        with:
          name: changed-files
          path: ./changed-files/

      # Resolve the run IDs holding the latest available E2E reports, used for shard balancing.
      - name: Resolve latest E2E report run IDs
        id: e2e-reports
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { join } = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const scriptPath = join(process.env.GITHUB_WORKSPACE, '.github/scripts/resolve-e2e-report-run-ids.mts');
            const { resolveE2EReportRunIds } = await import(pathToFileURL(scriptPath).href);

            await resolveE2EReportRunIds({ github, context, core });

      - name: Download test-e2e-chrome-report
        if: ${{ steps.e2e-reports.outputs.chrome-run-id != '' }}
        # `continue-on-error` matters: a missing report only costs shard balance (e2e falls back to a naive split)
        # failing here would skip both E2E workflows and fail ci-status-gate, blocking every PR.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-e2e-chrome-report
          path: test/test-results/
          github-token: ${{ env.GITHUB_TOKEN }} # This is required when downloading artifacts from a different repository or from a different workflow run.
          run-id: ${{ steps.e2e-reports.outputs.chrome-run-id }}

      - name: Download test-e2e-firefox-report
        if: ${{ steps.e2e-reports.outputs.firefox-run-id != '' }}
        # `continue-on-error` matters: a missing report only costs shard balance (e2e falls back to a naive split)
        # failing here would skip both E2E workflows and fail ci-status-gate, blocking every PR.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-e2e-firefox-report
          path: test/test-results/
          github-token: ${{ env.GITHUB_TOKEN }} # This is required when downloading artifacts from a different repository or from a different workflow run.
          run-id: ${{ steps.e2e-reports.outputs.firefox-run-id }}

      - name: Upload test-runs-for-splitting
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-for-splitting
          path: test/test-results/test-runs-*.json
          # Either download may have been skipped, so tolerate no files.
          if-no-files-found: ignore

      - name: Set use matrix
        id: set-use-matrix
        run: |
          # Configure suite shard counts here (suite name -> shard count)
          SUITE_SHARD_COUNTS=$(jq -cn '{
            "test-e2e-chrome-webpack": 20,
            "test-e2e-chrome-flask-webpack": 5,
            "test-e2e-firefox-webpack": 20,
            "test-e2e-firefox-flask-webpack": 5,
            "test-e2e-chrome-playwright": 2,
            "test-e2e-firefox-playwright": 2
          }')

          # Expand counts into the job matrix shape expected by downstream workflows
          MATRIX_JSON=$(jq -cn --argjson counts "$SUITE_SHARD_COUNTS" '
            reduce ($counts | to_entries[]) as $entry
              ({}; . + { ($entry.key): { index: [range(0; $entry.value)] } })
          ')

          echo "use-matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
